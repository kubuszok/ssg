# -------------------------------------------------------------------------------------------
# liqp's own JUnit suite (`src/test/java`) — 105 files, 639 live `@Test` (a 640th,
# `filters/date/FuzzyDateDateParserTest`'s, is commented out upstream), and the only behavioural
# evidence this port can ever have. CLAUDE.md §3 is explicit about the difference between this and
# a compile: four silent correctness defects in libGDX core all compiled cleanly, and not one of
# the Java forms in CLAUDE.md §4.4 moves a compile-error count.
#
# A DEPENDENT of `main.conf`: it resolves against `src/main/java`, never against the Scala that
# port emitted, so it INHERITS the base's `packageRenames { liqp = "ssg.liquid" }` and every
# surface phase through `base` rather than restating them (CLAUDE.md §1.5). Everything under
# `input`, `output`, `provenance` and `runtimeMode` is a fact about THIS source set's build and is
# deliberately its own.
#
# THE SUITE DOES NOT RUN YET, and the lane says so rather than skipping the stage. liqp's MAIN
# source set is at a measured 31 scalac errors, so `just liqp-measure` gates
# the run on 0 exactly as `sg-measure` does and prints "not running the suite: it does not
# compile". A test that cannot run is not a test that passed.
# -------------------------------------------------------------------------------------------

# see `main.conf`: the same three roots
roots {
  consumer = "../.."
  work     = "../../target/balticporter-work"
  ports    = "../../target/balticporter"
}

label = "ssg-liquid-test"
base  = "main.conf"

input {
  sourceRoot = "@consumer/original-src/liqp/src/test/java"

  # JUnit must be on the FRONTEND's classpath. An `import static org.junit.Assert.assertEquals`
  # the frontend cannot resolve does not FAIL — it resolves WRONGLY, to an unqualified call on the
  # enclosing test class. Recorded three times already (libGDX's `org.junit.Assert.*`, Ashley's
  # `org.mockito.Mockito.*`, simple-graphs); this port would have made it four.
  #
  # This file is the MAIN classpath — the six compile-scope jars AND the javac-compiled
  # ANTLR-generated parser, which `TestUtils`, `parser/v4/LiquidLexerTest` and
  # `parser/v4/LiquidParserTest` import directly (D-liqp-1) — plus `junit:junit:4.13.1`, the ONE
  # test-scope dependency `pom.xml` declares. `org.hamcrest:hamcrest-core:1.3` arrives with it
  # TRANSITIVELY and is deliberately not named: a port resolves what the library DECLARES.
  # Written by `LiqpTestClasspath.ensure`, which is where that reasoning lives.
  classpathFile = "@work/liqp-test-classpath.txt"

  resolutionRoots = ["@consumer/original-src/liqp/src/main/java"]

  # `excludeGlobs` REPLACES the default exclusions rather than adding to them; the test tree holds
  # no `package-info.java` or `module-info.java`, so there is nothing here to restate — and, since a
  # method-local named class is now translated through the shared class walk, nothing else either.
  # The four files this list used to name
  # (`ReadmeSamplesTest`, `TemplateTest`, `filters/DateTest`, `parser/LiquidSupportTest`) each
  # declare a method-local named class, which the frontend now lowers (`JS-C30`); the entry is
  # deleted rather than narrowed, exactly as it said it would be, and the 62 `@Test` it cost are
  # back in the census.
  excludeGlobs = []
}

output {
  portRoot  = "@ports/ssg-liquid"
  sourceSet = "test"
}

manifest {
  name    = "ssg-liquid-test"

  # The base contributes `packageRenames`, `governs` and the two surface phases; this adds the one
  # phase that is a fact about THIS source set. `TestFrameworkTransform` is JUnit-4-shaped and this
  # suite is unusually clean for it — no `@Rule`, no `@RunWith`, no `@Ignore`, no JUnit 3, no
  # test-class inheritance. Its two `@Before`s inline; its 46 `@Test(expected=…)` become
  # `intercept[E]`.
  #
  # WHAT IT DOES NOT CONVERT, and why that is a decision rather than an omission: the 767
  # `org.hamcrest.MatcherAssert.assertThat(x, is(y))` sites stay on hamcrest. The phase maps
  # `org.junit.Assert` onto `munit.Assertions` and has no matcher algebra to map a `Matcher<T>`
  # onto, so hamcrest is a RUN dependency as well as a frontend one. Measured (D-liqp-3): a
  # hamcrest `AssertionError` produces MUnit's `==> X` marker per test and the suite CONTINUES, so
  # `reconcile_outcomes` loses nothing. `PortabilityCheck`'s `org.hamcrest.` rule is what counts
  # the residue.
  # …and D-liqp-10, which is a fact about this source set for a different reason: this suite's data
  # classes are read reflectively, the other half of the same third-party reflection concern.
  # liqp's whole contract is "hand me
  # a POJO and I will read its public fields", and the suite exercises it — `Meta2`, `TagsHolder`,
  # `ObjectEntry`, four anonymous `Inspectable`s inside test methods. Java's `public Object a;` is
  # part of the class file's surface; the emitted `var a` is a PRIVATE jvm field with an accessor
  # named `a()`, so jackson finds ZERO properties and every lookup reads `null` — which liqp's
  # non-strict comparison coerces to `BigDecimal.ZERO`, so three assertions out of four answered
  # correctly from data that was not there. It never threw and no count moved.
  #
  # `except = []` is EVERYWHERE, deliberately: the fact is about the whole source set, not about a
  # list of classes somebody has to keep up to date — and four of the eight sites are ANONYMOUS
  # classes inside test bodies, which no FQN could name. The MAIN port does not carry this phase at
  # ALL, so it publishes no `Unexposed` rows and is not claiming that none of its types is exposed:
  # a candidate list is a residue of a POLICY, and unscoped it would be every public field in the
  # library, which is noise. The day one of the main port's own types is handed to a framework
  # the phase goes into ITS surface and the review list arrives with it. Two refusals are counted
  # rather than emitted: a bean name the java already declares (its own, or an ancestor's), and a
  # field whose bean name `java.beans.Introspector.decapitalize` cannot invert.
  surface = [
    { transform = "test-framework" },
    { transform = "public-field-accessors", scope { except = [] } },

    # `TestUtils.getNode` IS THIS SUITE'S OWN PARSER WIRING, and the base replaced the parser.
    #
    # 67 assertions across 14 node suites reach an expression node through it. Java builds an
    # ANTLR lexer, a token stream and the generated parser by hand, invokes the `output` rule and
    # hands the resulting parse tree to the visitor — the `rule` parameter is accepted and never
    # read, and every caller passes "expr". The replacement parser has no rule entry points: it
    # parses a whole template, so the body parses `{{ … }}` and takes the one node the root block
    # holds, which is the same OutputNode java's `visitOutput` returned.
    #
    # The PRECISE key is deliberate: the two-argument overload supplies this suite's default
    # parser and then delegates here, so replacing it too would state the default twice.
    { transform = "method-body"
      bodies {
        "liqp.TestUtils#getNode(String,String,TemplateParser)" = """{
  val lexer: ssg.liquid.parser.LiquidLexer = new ssg.liquid.parser.LiquidLexer(
    ssg.liquid.antlr.CharSources.fromString("{{ " + source + " }}"),
    templateParser.liquidStyleInclude,
    templateParser.stripSpacesAroundTags,
    templateParser.stripSingleLine,
    balticporter.runtime.JavaCollections.toJava(templateParser.insertions.getBlockNames()),
    balticporter.runtime.JavaCollections.toJava(templateParser.insertions.getTagNames())
  )
  val parser: ssg.liquid.parser.LiquidParser = new ssg.liquid.parser.LiquidParser(
    lexer.tokenize(),
    templateParser.insertions,
    templateParser.filters,
    templateParser.liquidStyleInclude,
    templateParser.evaluateInOutputTag,
    templateParser.errorMode
  )
  return parser.parse().getChildren()(0)
}"""

        # THE ONE PLACE THIS SUITE CALLS strftime4j ITSELF: `HybridFormat.padLeft`, borrowed as a
        # padding helper by `DateTest`'s own assertions. The replacement evaluator carries the same
        # function, because a test that pads its expected value is not a test about strftime4j.
        "liqp.filters.DateTest#withOptionalPadding" = """{
  return ssg.liquid.filters.date.Strftime.padLeft(input, count, padSymbol)
}"""
      } },
  ]

  # -----------------------------------------------------------------------------------------
  # TWO FILES THAT TEST THE GENERATED ANTLR PARSER ITSELF, AND THE 86 TESTS THAT GO WITH THEM.
  #
  # Both assert against the artefact the base port replaces rather than against liquid:
  #
  #   `parser/v4/LiquidLexerTest` (72 tests) reads the GENERATED LEXER's integer token types —
  #   `LiquidLexer.OutStart`, `LiquidLexer.Str`, one constant per grammar token — off a
  #   `CommonTokenStream`, and asserts the exact sequence for each input. The replacement lexer
  #   has an enum where those constants were and no lexer modes, so there is no expression that
  #   means the same thing: a faithful translation would be a token-type mapping table plus the
  #   claim that the two lexers agree token for token, which is the thing under test and cannot
  #   be assumed by the test that tests it.
  #
  #   `parser/v4/LiquidParserTest` (14 tests) invokes a named grammar rule BY REFLECTION
  #   (`LiquidParser.class.getMethod(ruleName).invoke(parser)`) and asserts over the resulting
  #   parse tree's children and text. The replacement parser exposes no rule entry points and
  #   builds no parse tree, and reflection does not exist on Scala.js or Native either.
  #
  # Both are LOST, not skipped: the discovery gate reads 639 `@Test` in java against the emitted
  # registrations, so these 86 stay in the `!! TESTS LOST` line for as long as they are dropped.
  # What they were evidence FOR — that liqp's grammar is read correctly — the other 551 tests
  # still measure end to end, through `Template.render`. The consumer also carries 139 hand-written
  # munit tests for the hand-written lexer and parser (99 and 40, in `ssg.liquid.parser.test`),
  # re-expressed against them rather than against ANTLR's token constants; those stay in the
  # consumer, and nothing is copied into this engine.
  # -----------------------------------------------------------------------------------------
  dropTypes = [
    "liqp.parser.v4.LiquidLexerTest",
    "liqp.parser.v4.LiquidParserTest",
  ]

  # -----------------------------------------------------------------------------------------
  # THE 33 TESTS THAT READ AN ARBITRARY OBJECT'S FIELDS — they PASS, and they pass ON THE JVM.
  #
  # What they exercise is `Inspectable` and EAGER evaluate mode: liqp lets a template read a POJO's
  # public properties, which java did by handing the object to jackson (`convertValue(variables,
  # ObjectNode.class)` in `LiquidSupport.objectToMap`). The JVM can do that, so on the JVM this
  # port does it — `ssg.liquid.json.Beans` on the `jvm` platform row reads public getters and
  # public fields, which is what jackson's default bean serialisation read. Scala.js and Scala
  # Native cannot ask an object what members it has, so their copy of that one object raises by
  # name (`UnsupportedOperationException`), and nothing else in the port differs between rows.
  #
  # THIS LANE RUNS TESTS ON THE JVM ROW ONLY (`port-ssg-liquidJVM/testOnly *`); the other two rows
  # are compiled, not run. So these 33 are green here and WILL FAIL on Scala.js and Scala Native —
  # a platform fact, not something to ignore. A consumer that runs this suite cross-platform puts
  # exactly these suites in its JVM-only test directory:
  #
  #   ReadmeSamplesTest (2), TemplateTest (5), blocks/ForTest (1), filters/Relative_UrlTest (1),
  #   filters/SizeTest (1), filters/SortTest (1), filters/where/JekyllWhereImplTest (5),
  #   filters/where/LiquidWhereImplTest (2), nodes/GtNodeTest, GtEqNodeTest, LtNodeTest,
  #   LtEqNodeTest (1 each), parser/LiquidSupportTest (11)
  #
  # Every other route into the same code works on all three rows: a `java.util.Map`, a nested map,
  # a collection, an array, a date, and a class implementing `LiquidSupport`, whose `toLiquid()` is
  # called where java's `@JsonSerialize` annotation used to point jackson at the same method.
  # -----------------------------------------------------------------------------------------

  # -----------------------------------------------------------------------------------------
  # DECISION D-liqp-7 — TWO TESTS THIS SUITE DOES NOT RUN, at the smallest granularity that is
  # honest, and NOT the file.
  #
  # `cartesianProduct` is declared `protected <T> List<List<T>>`; java's
  # `<T>` bound is VACUOUS and the emitted `T <: java.lang.Object` is not, because Scala 3 roots
  # `java.io.Serializable` at `Any` (value classes are serialisable). So the fixture's own written
  # type — `List<List<Serializable>> cases = cartesianProduct(…)` — does not conform, and this is
  # the first corpus library to write `Serializable` as a type argument at all.
  #
  # The fix is to stop emitting the vacuous bound, and it has been BUILT AND MEASURED THREE WAYS:
  # libGDX core 0 -> 50 for every bound and 0 -> 6 for methods only, with the two halves coupled
  # (CLAUDE.md §4.4's reference-identity rule and the wildcard-argument rendering rule both read
  # that bound). The cheaper
  # place to stand was evaluated too and does not exist: pinning the inferred lub to `Object` moves
  # the mismatch onto the DECLARATION one line down and closes nothing, `Buffer` being invariant.
  # Both are written up with their numbers and both say DO NOT RETRY BLIND.
  #
  # So the engine's answer is open and priced, and the port's answer is to say which tests it does
  # not run. THREE MEMBERS, and the three are one decision: the helper carries the construct, and
  # the two `@Test`s that call it are its only callers — dropping the helper alone would leave two
  # dangling calls, and excluding the FILE would take FIVE `@Test` when two is the true cost. The
  # other three tests in this suite (`testComparingNumbers`, `testComparingStrings`,
  # `testComparingBooleans`) are untouched and run.
  #
  # The loss is COUNTED and stays loud: `just liqp-measure`'s discovery gate reads
  # `639 @Test in java` against the emitted munit registrations, so these two show up in the
  # `!! TESTS LOST` line beside the 62 the local-class exclusion cost, for as long as they are
  # dropped. A test that does not run is never reported as a test that passed.
  #
  # DELETED, not narrowed, the day the engine stops emitting the vacuous bound.
  # -----------------------------------------------------------------------------------------
  dropMethods = [
    "liqp.nodes.ComparingExpressionNodeTest#testCombunationsStrctWithExpectation(String,TemplateParser)",
    "liqp.nodes.ComparingExpressionNodeTest#testCombinationsStrict()",
    "liqp.nodes.ComparingExpressionNodeTest#testCombinationsNonStrict()",
  ]

  # -----------------------------------------------------------------------------------------
  # DECISION D-liqp-14 — THREE `omissions` ROWS THIS SOURCE SET HAS READ.
  #
  # `annotation dropped` is one of the two kinds on that lane that take an accept, and it takes one
  # for a reason stated in the engine rather than here: `FrontendConfig.preservedAnnotations` exists
  # because WHICH annotations bear behaviour "is a fact about a library and its dependencies, never
  # about java." That parameter is the CARRY half; these keys are its
  # complement — this port states that these three are right to lose, per declaration, rather than
  # claiming a whole family is worth carrying.
  #
  # All three are `@SuppressWarnings` on a FIELD, and each names a javac warning with no scala
  # counterpart at all:
  #
  #   TemplateTest$Foo#c                     "unused"  — a `private String c` with no accessor and no
  #                                                      reader, beside a `private String b` that has
  #                                                      `getB()`: the pair is the fixture for what
  #                                                      liqp's property lookup must and must not see
  #   JekyllWhereImplTest#array_of_objects1  "serial"  — the double-brace `new HashMap<>() {{ … }}`
  #   JekyllWhereImplTest#array_of_objects3  "serial"    idiom, whose anonymous subclass of a
  #                                                      Serializable type has no `serialVersionUID`
  #
  # Neither warning exists in scala, `@SuppressWarnings` does not exist in scala, and scalac derives
  # nothing from one — so carrying them would put text on three emitted `var`s that says nothing to
  # any tool that reads it. Note the emitter renders a class's and a method's annotations and NOT a
  # field's, which is why these three are reported at all and why an accept is the only answer that
  # could ever move them: `preservedAnnotations` is scoped to the TYPE deliberately, and a field
  # entry there would reduce this count while emitting nothing (its own doc says so).
  #
  # THE OTHER SEVEN ROWS STAY, and they are the residue this decision makes visible rather than
  # hides: every one is a `@SuppressWarnings` on a field of an ANONYMOUS class — `ReadmeSamplesTest$21`,
  # `ForTest$34`, `Relative_UrlTest$39`, `SizeTest$40` — whose owner is named by a FRONTEND-MINTED
  # index, and CLAUDE.md §4.56 forbids a port from keying policy on a name the engine invented and is
  # free to renumber. A key that named one would bind today and silently move the day a test above it
  # gains an anonymous class.
  # -----------------------------------------------------------------------------------------
  resolutions {
    "liqp.TemplateTest$Foo#c"                             = "accept-dropped-annotation"
    "liqp.filters.where.JekyllWhereImplTest#array_of_objects1" = "accept-dropped-annotation"
    "liqp.filters.where.JekyllWhereImplTest#array_of_objects3" = "accept-dropped-annotation"
  }

  # D-liqp-13, at THIS source set — and `dependencies` is not inherited (CLAUDE.md §1.5), so the
  # base's two entries are not here by accident: they are here because this suite's own 134 sites
  # need them. A build fact belongs to the build that ships it, exactly as `inject` does.
  #
  # THREE entries where the main port has two, and the third is the whole reason the two lists are
  # written apart: 6 of these sites are `java.time.ZoneId.of(String)`, which resolves a zone BY
  # STRING and therefore needs the IANA database rather than the `java.time` surface (`JS-L63`
  # names `scala-java-time-tzdb` for exactly that, and says the trimmed-database alternative is a
  # build-time action). The library itself never calls it; its suite does, which is why this is the
  # module that pays for the database.
  #
  # It lands in the TEST configuration of the generated build for the same reason — `PortRun` reads
  # this run's own `sourceSet` — so nothing here reaches the published library's dependencies.
  dependencies = [
    { org = "io.github.cquiroz", name = "scala-java-time",      rev = "2.6.0", cross = "platform" },
    { org = "io.github.cquiroz", name = "scala-java-time-tzdb", rev = "2.6.0", cross = "platform" },
    { org = "io.github.cquiroz", name = "scala-java-locales",   rev = "1.5.4", cross = "platform" },
  ]
}

provenance {
  upstreamName     = "liqp"
  originalLicense  = "MIT"
  sourcePathPrefix = "src/test/java"
  # The same two files the main port ships, into the same `src_managed/` — this source set is a
  # derived work of the same MIT original, and stating it here is what makes running THIS port
  # alone (a fresh checkout, a `clean`ed module) ship the notice too. Both writes are the upstream's
  # own bytes at one path, so there is nothing to drift. CLAUDE.md §1.5: `provenance` is a fact
  # about this source set's build and is deliberately NOT inherited.
  notices = [
    "@consumer/original-src/liqp/LICENSE",
    "@consumer/original-src/liqp/NOTICE",
  ]
}

# NOT `vendored`, unlike the main port: that source set is compiled beside this one and already
# carries the shims. Vendoring again would define every support type twice — which the JVM
# tolerates only while the copies agree, and the Scala.js/Native linkers reject.
runtimeMode = "dependency"

# -------------------------------------------------------------------------------------------
# TWO THINGS THIS SOURCE SET NEEDS THAT NO KEY HERE CAN STATE. Both belong to the RUN, both are
# `just liqp-measure`'s, and both are recorded here because this file is where an agent looks for
# them (CLAUDE.md §4.575 — the note grammar renders into emitted `.scala` and
# there is no emitted file for either of these, so the decision is written where the question is
# asked).
#
#  1. A `META-INF/services` RESOURCE. `liqp/spi/SPIHelper.findProviders()` does
#     `ServiceLoader.load(TypesSupport.class)`, reached from `Template`'s `static { }` block — i.e.
#     effectively from the whole suite — and from `LiquidSupport`'s type-referencing setup, i.e.
#     from every render of a POJO. The engine emits `.scala` and NOTHING ELSE, so nothing carries
#     `src/main/resources/META-INF/services/liqp.spi.TypesSupport`; absent, the loader finds zero
#     providers, `applyCustomDateTypes()` silently no-ops, and there is no compile error, no check
#     count and no finding. And it is not a copy: under `packageRenames` above the file's NAME is
#     the renamed interface FQN and its CONTENTS are renamed provider FQNs (CLAUDE.md §4.56, in a
#     format `PackageRenameTransform` has never seen).
#
#     The milestone answer is the port's HAND-WRITTEN half (CLAUDE.md §5.5 — `src/` is hand-written,
#     `src_managed/` is the build product): `liqp-core/src/main/resources/META-INF/services/
#     ssg.liquid.spi.TypesSupport`, committed, holding the two renamed provider names, and reaching
#     the test JVM through `--resource-dir` on the lane's `scala-cli test`. `PortabilityCheck`'s
#     `java.util.ServiceLoader` rule is the counted half and is already shipped; the engine still
#     cannot copy and rename the service-provider descriptor itself, so item 1's file stays
#     hand-written.
#
#  2. A WORKING DIRECTORY. 45 `@Test`s read `./snippets/`, `./_includes/` and `src/test/jekyll/`
#     by RELATIVE path, and `TemplateTest.parseWithInputStream` reaches them through
#     `new FileInputStream(new File(…))` — the PROCESS cwd, which `-Duser.dir` does not reach
#     (verified). The paths are NOT parameterised: they are what upstream asserts, and rewriting
#     them would make the port a different program (CLAUDE.md §3.5 — a skip is not a model). The
#     lane builds a symlink fixture tree under its own scratch and runs `scala-cli test` from it
#     with `--workspace`, so nothing is written into the ssg submodule's working tree.
# -------------------------------------------------------------------------------------------

nextStep = "just liqp-measure"
