# -------------------------------------------------------------------------------------------
# How ssg-liquid is generated from liqp (https://github.com/bkiers/Liqp, `original-src/liqp`), a
# Java implementation of the Liquid templating engine backed by an ANTLR grammar.
#
# This file is ssg's: the build (`project/BalticPorterGen.scala`) hands it to the Baltic Porter
# engine, which holds no knowledge of liqp. Change the port here, regenerate, run the tests — no
# engine release is involved. Paths are relative to THIS FILE unless they start with a root name.
# -------------------------------------------------------------------------------------------

roots {
  consumer = "../.."                            # this repository: the upstream submodules and the reference port
  work     = "../../target/balticporter-work"   # files the run prepares for itself (resolved classpaths, compiled parser)
  ports    = "../../target/balticporter"        # where the generated code goes
}

label = "ssg-liquid"

input {
  # A BASE port: nothing is merely resolved against, everything is converted.
  sourceRoot = "@consumer/original-src/liqp/src/main/java"

  # NO `preservedAnnotations`, and the reason is worth keeping because the key used to be here.
  #
  # `LiquidSupport` is declared `@JsonSerialize(using = LiquidSupport.LiquidSerializer.class)`, and
  # that annotation is not decoration: jackson looks the serializer up ON THE INTERFACE, so without
  # it a `SuppPojo implements LiquidSupport` was BEAN-serialised, `toLiquid()` was never called, and
  # liqp's EAGER evaluate mode rendered the pojo's own properties. Three tests
  # (`testLookupNode2c`, `testMapFilter2c`, `renderLiquidSupportWithNewRenderingSettings`) read
  # `childOK`/`not this` where java reads `SuppChild`/`OK`.
  #
  # The mapper is no longer jackson's (see the `type-redirect` entry below), and the replacement asks
  # the QUESTION rather than reading an annotation: `JsonMapper.normalise` calls `toLiquid()` on a
  # value that IS a `LiquidSupport`. So the annotation has no reader left, carrying it would put a
  # jackson name back in the emitted text, and the three tests are what says the behaviour survived.

  # The frontend's view of everything liqp does NOT declare: the six jars `pom.xml` lists at
  # compile scope, plus the ANTLR-generated parser compiled to class files.
  #
  # DECISION D-liqp-1 — THE GENERATED PARSER IS EXTERNAL IN THIS MILESTONE. liqp's sources
  # `import liquid.parser.v4.{LiquidLexer, LiquidParser, …}`: six files, 9 432 lines, generated
  # from `src/main/antlr4/**.g4` by the antlr4-maven-plugin into `target/generated-sources/antlr4`
  # and UNTRACKED — present in a built checkout, absent in a fresh one. They are NOT in
  # `sourceRoot`; the frontend resolves them by class file, the emitted Scala names them fully
  # qualified, and `just liqp-measure` puts the same directory on scalac's classpath. Porting the
  # generated parser through the engine is a recorded LATER milestone (a second module), never a
  # thing to decide by accident.
  #
  # DECISION D-liqp-1b — …AND IT IS COMPILED INTO THE NAMESPACE THIS PORT EMITS. D-liqp-1 and
  # D-liqp-2 cut each other: the generated `LiquidParser` has a member typed
  # `liqp.TemplateParser.ErrorMode`, and this port emits that type as `ssg.liquid.TemplateParser
  # .ErrorMode`, so three call sites hand the parser an argument of a type its class file does not
  # name. No manifest key closes that — none of them rewrites an ARGUMENT, and a `type-redirect` at
  # that enum would move the port's own type everywhere and make the emitted library depend on
  # upstream liqp bytecode.
  #
  # What settles it is that the generated parser is not a DEPENDENCY: it is a BUILD PRODUCT of this
  # port's own build step, regenerated from `src/main/antlr4/**` and untracked. So `LiqpClasspath`
  # copies the six generated files, rewrites their references INTO the ported library to the
  # emitted namespace, and javacs THAT. D-liqp-1 is unchanged — the parser is still external, still
  # resolved by class file, still a later milestone to port through the engine.
  #
  # Three things about the rewrite that are not incidental, all in `LiqpClasspath`:
  #
  #   * it cuts only at a `.` (CLAUDE.md §4.56). `liqp.TemplateParser` is rewritten; the parser's
  #     own package `liquid.parser.v4` is not, and neither is any identifier that merely CONTAINS
  #     the string — a prefix is not a structural fact about anything;
  #   * it rewrites the ENUM CONSTANT ACCESS too, and that half is invisible to a compile. The port
  #     emits a java enum as a Scala `sealed abstract class` plus `case object`s, whose static
  #     forwarders carry `valueOf`/`values` and NOT the constants, so `ErrorMode.LAX` compiles
  #     against any java enum and is a `NoSuchFieldError` at RUN time — CLAUDE.md §3's defect class exactly.
  #     `ErrorMode.valueOf("LAX")` reaches the forwarder and returns the same singleton, so `==`
  #     still holds;
  #   * javac resolves the rewritten names against a SHAPE-HONEST stub (`javac-stub/`), read as a
  #     `-sourcepath` under `-implicit:none` so it is never written into the output. It declares no
  #     constants, so a form the runtime could not link is a javac error here; and upstream `liqp`
  #     is on no classpath of that step at all, so a reference the rewrite missed cannot resolve.
  #
  # The `out/liqp-upstream-classes` directory this port used to build — upstream liqp compiled
  # beside the parser, for scalac only, because scalac reading `liqp.TemplateParser$ErrorMode`
  # without it ABORTS instead of reporting — is GONE. There is no seam left for it to soften.
  #
  # The file is written by `LiqpClasspath`, which also runs the rewrite and the javac step, so the
  # frontend has ONE input to read. A declared classpath file that is not there is fatal
  # (`PortConfig`), and a missing generated tree is fatal with the regeneration command
  # (`LiqpClasspath`): an unresolvable import does not fail the frontend, it resolves WRONGLY, and
  # the port then emits nonsense and reports success (CLAUDE.md §5.1).
  classpathFile = "@work/liqp-classpath.txt"
}

output {
  portRoot  = "@ports/ssg-liquid"
  sourceSet = "main"
}

# liqp's policy. A BASE manifest — it has no bases of its own.
manifest {
  name    = "ssg-liquid"
  governs = ["liqp"]

  # DECISION D-liqp-2 — the reference hand-port's namespace (`../ssg/ssg-liquid`, `package
  # ssg.liquid`), the same convention simple-graphs follows to `sge.graphs`. ssg cannot adopt
  # output in the upstream namespace, so this is real policy rather than an exercise.
  #
  # `packageRenames` is DATA rather than a surface entry (CLAUDE.md §4.56): the rename must run
  # after every other phase, because all of their policy is written in the upstream namespace, and
  # `runsAfter` cannot state "after everything". `PortRun` appends it last and verifies it with
  # `PackageRenameTransform.check`.
  #
  # The generated parser's package `liquid.parser.v4` is deliberately NOT renamed: it is external
  # in this milestone (D-liqp-1 above), so its class files keep the name they were compiled under.
  # What the rename DOES reach is the ANTLR output's one member typed `liqp.TemplateParser
  # .ErrorMode` — the seam D-liqp-1b answers, by rewriting the generated sources into this map's
  # right-hand side before javac reads them. The map here is the one statement of that namespace;
  # `LiqpClasspath` restates it in Scala and nothing compares the two, so a change is a change in
  # both places.
  packageRenames { liqp = "ssg.liquid" }

  # THE HAND-WRITTEN HALF OF THE ANTLR REPLACEMENT (see the `type-redirect` entry below for what
  # it replaces and why). Seven files, in this port's own emitted namespace: the three
  # `ssg.liquid.antlr` stand-ins for the ANTLR runtime types, the lexer and parser read off
  # liqp's own grammar (`src/main/antlr4/liquid/parser/v4/*.g4`), the token vocabulary they share,
  # and what is left of the parse-tree visitor.
  #
  # `inject` is a build artefact rather than shared policy (CLAUDE.md §1.5): the test source set
  # is a dependent and must NOT ship these files a second time, and it does not — it inherits the
  # drop below and links against what this module emits.
  inject = ["inject"]

  # THE ONE OPERATION WHOSE ANSWER DIFFERS PER PLATFORM, and the only place this port needs a row.
  #
  # `JsonMapper.normalise` reaches `ssg.liquid.json.Beans.toMap` for a value that is neither a map,
  # a collection, an array, a scalar nor a `LiquidSupport` — liqp's `Inspectable` and its EAGER
  # evaluate mode, where java read the object's PUBLIC PROPERTIES through jackson. The JVM has that
  # and therefore gives java's answer; Scala.js and Scala Native cannot ask an object what members
  # it has, so their file raises by name. ONE call site in the shared row, one small object per
  # platform row, and the two rows that cannot answer share a directory because their answer is the
  # same refusal.
  #
  # What the JVM row reproduces is jackson's DEFAULT bean serialisation and nothing more: public
  # no-argument getters (`getX`, and `isX` at a boolean) and public fields. liqp declares no jackson
  # property annotation anywhere in its main or test sources, so none is honoured — checked, not
  # assumed. Properties come out ordered by name, because jackson's own order is reflection order
  # and java does not specify that.
  platformDirs {
    jvm    = ["rows/jvm"]
    js     = ["rows/no-reflection"]
    native = ["rows/no-reflection"]
  }

  # `NodeVisitor` walks the ANTLR parse tree and builds the LNode AST from it. The replacement
  # parser builds that AST while it parses, so there is no second tree and nothing to walk: the
  # injected replacement keeps java's constructor and `visit`, and `visit` answers the AST it was
  # handed. That is what lets `Template.renderToObjectUnguarded` — which also carries this port's
  # jackson and thread-local behaviour — port with no key of its own.
  dropTypes = ["liqp.parser.v4.NodeVisitor"]

  # EVERY REMAINING MEMBER WHOSE SIGNATURE NAMES AN ANTLR TYPE. A redirect moves a type; these
  # five declarations have no counterpart to move to, so they are dropped and their callers are
  # gone with them.
  #
  #   * `LiquidException`'s two ANTLR constructors and the three private statics that only serve
  #     the first of them: they format a message out of an ANTLR `RecognitionException` — its
  #     offending token, its expected-token set and the generated parser's token vocabulary.
  #     Nothing in liqp calls either: java raises them from the two error listeners in
  #     `Template.parse`, which is replaced above, and the replacement parser raises the
  #     message/line/column constructor that stays.
  #   * `FilterNode`'s `ParserRuleContext` constructor, whose only caller was `NodeVisitor`. The
  #     four-argument one it delegated to is what the replacement parser calls, which is what the
  #     `visibility` entry below ships public.
  #   * `Template.walk` and `Template.children`, the two private helpers of `toStringTree` — they
  #     walk an ANTLR tree's children and read each node's context class name.
  dropMethods = [
    "liqp.exceptions.LiquidException#<init>(RecognitionException)",
    "liqp.exceptions.LiquidException#<init>(String,ParserRuleContext)",
    "liqp.exceptions.LiquidException#createMessage",
    "liqp.exceptions.LiquidException#tokenName",
    "liqp.exceptions.LiquidException#tokenNames",
    "liqp.nodes.FilterNode#<init>(ParserRuleContext,Filter)",
    "liqp.Template#walk",
    "liqp.Template#children",
  ]

  # The starting policy, and deliberately the same two phases simple-graphs starts from: milestone
  # 1 measures a WALL, and a wall measured under invented policy says nothing about the engine.
  # Every adjustment after this one arrives with the number that justified it.
  # DECISION D-liqp-8 — jackson's `TypeReference` is a reified carrier.
  #
  # `LiquidSupport.LiquidSupportFromInspectable.MAP_TYPE_REF` is a super-type token: its type
  # argument survives erasure into the class file's generic signature and jackson READS IT BACK at
  # `convertValue(value, MAP_TYPE_REF)` and constructs from it. Retyped along with every honest slot
  # the port asks jackson for `scala.collection.mutable.Map`, which has no creators — 10 test
  # failures, 0 compile errors, every check count flat. The argument therefore stays java's and the
  # value is bridged where it is used.
  #
  # It is POLICY and not an engine table because a carrier is a fact about THIS library's
  # dependencies: liqp uses jackson, so `TypeReference` is its carrier, and a library on gson or
  # guice would write `TypeToken` or `Key` here. `java.lang.Class` is the one java itself
  # guarantees and the engine carries it, so `Map.class`/`HashMap.class` need no entry.
  # D-liqp-9: the same third party at the other end of the same call. A carrier is jackson
  # reading the class file's TYPE ARGUMENTS; `ObjectMapper` also reads
  # the OBJECT, at a `java.lang.Object` formal that takes anything. So the port compiles, every
  # check reads flat, and `writeValueAsString(aMap)` emits
  # `{"scala$collection$mutable$HashMap$$table":[…]}` where java emitted the map's entries — with
  # the `table` array (a `java.util.ArrayList`) then failing a cast three hops away in the `where`
  # filter. Naming the owner here bridges every such argument through
  # `JavaCollections.Reified.toJavaValue`, which decides at RUN TIME because there is nothing to
  # decide from at the call: liqp's whole data model is `Object`, holding java's values and the
  # port's at the same slot.
  #
  # Seven sites, all in `Json.apply`, `Template.putStringKey`, `LiquidWhereImpl` and
  # `LiquidSupport.objectToMap`. It is POLICY for the reason the carrier above is, one step
  # stronger: java guarantees no reflective sink at all, so the engine ships an empty list and the
  # `OpaqueEgress` boundary rows are where a port reads the candidates off.
  # DECISION D-liqp-11 — THE SPI DESCRIPTOR IS PART OF THE DELIVERABLE, AND BOTH ITS NAMESPACES MOVE.
  #
  # `SPIHelper.findProviders()` does `ServiceLoader.load(TypesSupport.class)`, reached from
  # `Template`'s `static { }` block — i.e. effectively from the whole suite — and from
  # `LiquidSupport`'s type-referencing setup, i.e. from every render of a POJO. The provider list
  # lives in `src/main/resources/META-INF/services/liqp.spi.TypesSupport`, which no phase could
  # carry: the engine emitted `.scala` and nothing else, and with the resource absent the loader
  # finds ZERO providers, `applyCustomDateTypes()` becomes a no-op, and there is no compile error, no
  # check count and no finding.
  #
  # This key is the mechanism; what is per-library is only WHICH file. Both namespaces move (CLAUDE.md §4.56):
  # the FILE NAME is the renamed interface FQN (`ssg.liquid.spi.TypesSupport`) and the two LINES are
  # renamed provider FQNs, translated through this port's own `packageRenames` above by the run's own
  # rename phase — so changing D-liqp-2 cannot leave the descriptor stale. It replaces the
  # hand-written `ported/ssg-liquid/src/main/resources/…` file this port used to ship, which was the
  # one hand-written file of this port and had to be kept in step with the rename by hand.
  serviceProviders = [
    "@consumer/original-src/liqp/src/main/resources/META-INF/services/liqp.spi.TypesSupport",
  ]

  # DECISION D-liqp-12 — `ServiceLoader` is redirected at a cross-platform wrapper library rather
  # than shimmed per port or accepted as JVM-only, which is what discharges the refusal this entry
  # used to record.
  #
  # `SPIHelper.findProviders()` is `ServiceLoader.load(TypesSupport.class)` followed by
  # `loader.iterator()`, and it is the site D-liqp-11 above exists for: this port SHIPS the
  # descriptor that lookup reads. Reading the site, the obvious reaction is "yes, this is JVM-only,
  # stop reporting it" — which is what the menu's `accept-jvm-only` said, and it was REFUSED here
  # with the `targets-contradiction` guard: this manifest declares no `targets`, so it claims all
  # three, and a module cannot be built for a backend and accept an API that backend does not have.
  #
  # That refusal was CORRECT and it is now obsolete, so the entry is GONE rather than kept as a
  # commentary. A `resolutions` key that binds to a real declaration, names a live remedy and can
  # never fire is an inert selection, which `PolicyIssue.NeverApplied` reports as a `policy` finding
  # — the port would be claiming to have read a site whose finding no longer exists.
  #
  # WHAT REPLACES IT is two surface entries below and one `dependencies` line, and NO new engine
  # phase: `java.util.ServiceLoader` is both a FACTORY and a HANDLE in java, and the wrapper splits
  # them the way scala does (`PlatformServiceLoader.load` returns a `ServiceProviders[T]`), so the
  # TYPE occurrences and the STATIC CALL need two different targets and the engine already has one
  # keyed seam for each.
  surface = [
    # THE TWO CALLS, AND WHY THEY RUN FIRST. `Pipeline.order` is stable in the order this list
    # declares, and both entries below are ordered against a phase rather than by taste:
    #
    #   * BEFORE `type-redirect`, because that phase mints a static TWIN owned by its target for
    #     every static of the redirected type — after which `load`'s callee symbol occurs nowhere and
    #     this key matches nothing, silently, which is the `NeverMatched` case that phase's own
    #     finding warns about;
    #   * BEFORE `collections`, because that phase COERCES at an external callee whose return type is
    #     a JDK collection, and `iterator()` is exactly that. Left to fire it emits
    #     `JavaCollections.fromJava(loader.iterator())` against a receiver that is no longer a
    #     `java.util.ServiceLoader` — measured, 0 -> 1 errors, `E134` with no overload of `fromJava`
    #     taking a `scala.collection.Iterator`. Substituted first there is no callee left to coerce.
    #
    # THE FACTORY. `ServiceLoader.load(Class)` is a static whose RESULT is the handle, and the
    # wrapper puts the factory on a different object than the handle — the split scala makes and java
    # does not — so this is a call rewrite and not a member of the redirect below. The key is PRECISE
    # because the JDK overloads `load` three ways (`load(Class)`, `load(Class,ClassLoader)`,
    # `load(ModuleLayer,Class)`) and a positional template can only be right for one arity.
    #
    # THE ITERATOR, which is the ONE SEAM the redirect creates and the reason it is bridged here
    # rather than assumed away. `ServiceProviders#iterator()` carries java's own ARITY (CLAUDE.md
    # §4.5 is why the wrapper was written that way) and NOT java's element type: it answers a
    # `scala.collection.Iterator` where `java.util.ServiceLoader#iterator()` answered a
    # `java.util.Iterator`, which this port retypes to `balticporter.runtime.JavaIterator`. Those are
    # two different types and the seam is a typer error rather than anything silent, which is what
    # makes a one-line bridge the whole answer: `JavaIterator.from` takes exactly the scala iterator
    # the wrapper hands back.
    { transform = "call-site-substitution"
      calls {
        "java.util.ServiceLoader#load(Class)" = "multiarch.serviceloader.PlatformServiceLoader.load({arg0})"
        "java.util.ServiceLoader#iterator()"  = "balticporter.runtime.JavaIterator.from({recv}.iterator())"
      } },

    # BOTH KEYS KEEP JACKSON'S NAMES, and that is not an oversight: this phase runs BEFORE the
    # `type-redirect` below, so the types it is asked about are the ones the FRONTEND resolved —
    # jackson's. Re-pointed at the replacement they matched nothing and the run said so (one
    # `policy` finding, `never matched`), which is the key working.
    #
    # Both facts survive the replacement, each one step removed from its original reason. The
    # carrier is no longer "jackson reads the class file's type arguments" but "the replacement
    # mapper answers a super-type token with java's own map"; the sink is no longer "jackson
    # reflects over the object" but "the mapper decides from the RUNTIME value which JSON shape it
    # is" — and it has to, because liqp's whole data model is `Object`, holding java's values and
    # this port's at the same slot. Without the bridge a retyped `mutable.HashMap` arriving at a
    # `java.lang.Object` formal is not a map to `JsonMapper.normalise`, which would then refuse it
    # as an object whose fields it will not read.
    #
    # `Sort$ComparableMapEntry` IS LEFT AS JAVA WROTE IT. It implements both `Map.Entry<K,V>` and
    # `Comparable<Map.Entry<K,V>>`; a pair cannot be its parent, so the entry parent stays java's
    # while the `Comparable` argument was retyped to a pair — and `compareTo` is only ever handed
    # another `ComparableMapEntry`, which is no pair: a ClassCastException in the bridge, on every
    # `sort` of a map.
    { transform = "collections"
      scope { except = ["liqp.filters.Sort$ComparableMapEntry"] }
      reifiedCarriers = ["com.fasterxml.jackson.core.type.TypeReference"]
      reflectiveSinks = ["com.fasterxml.jackson.databind.ObjectMapper",
                         "com.fasterxml.jackson.core.JsonGenerator"] },
    { transform = "mutable-params" },

    # THE HANDLE. Every remaining occurrence of the type — the local's declared type here, and any
    # field, cast or type argument a library writes — becomes the wrapper's handle.
    #
    # WHAT MAKES THIS FAITHFUL IS THE SHAPE OF THE TARGET, not a guard and not a count.
    # `ServiceProviders` declares `iterator()` and `toList` and NOTHING ELSE: no `stream()`, no
    # `reload()`, no `Provider`, and it is not an `Iterable`. So every way this redirect could be
    # wrong AT A TYPE is a SLOT WHOSE TWO SIDES DISAGREE — a member java's `ServiceLoader` has and the
    # wrapper does not simply fails to resolve, and the one member both spell is the seam bridged
    # above. For the TYPES the compiler is the instrument, in this lane and in any consumer's.
    #
    # …AND THAT IS NOT THE WHOLE DELTA, which this comment used to claim. What `load` FINDS is a
    # different question with no slot in it: java's trigger is the CLASSPATH SCAN `load` performs, so
    # shipping the descriptor (D-liqp-11 above) is everything the JVM needs, while Scala.js and Scala
    # Native have no scan and resolve by REGISTRATION — which lives in a generated object body that
    # neither this port's emitted Scala nor its generated build ever touches. This manifest declares
    # no `targets`, so it claims all three, and on a future JS or Native build `findProviders()` would
    # answer an EMPTY iterator with no compile error and no other count: the same descriptor defect
    # one platform over. It is COUNTED and not closed — one `off-jvm-unwired` row per
    # descriptor on the `service-providers` lane, naming what building the trigger on that platform
    # would take. Narrowing `targets` to `[jvm]` would remove the row and is deliberately NOT
    # done: sge and ssg target every platform wherever possible (CLAUDE.md §1.5), and this port is
    # otherwise portable.
    # THE ANTLR RUNTIME, AND THE PARSER GENERATED FROM liqp's OWN GRAMMAR, ARE REPLACED RATHER
    # THAN PORTED — the port claims all three platforms and the ANTLR runtime is JVM-only.
    #
    # WHAT THIS REPLACES IS FIVE EXTERNAL TYPES AND NOTHING OF liqp's. Reading the eight files
    # that name ANTLR, the coupling is narrow: a CharStream is a template's characters plus the
    # name they were read under, a ParseTree is what the visitor turns into an LNode, and the
    # generated lexer is constructed once. Each gets a hand-written stand-in under
    # `balticporter/corpus/liqp-overrides/`, and liqp's own `FilterCharStream`,
    # `CharStreamWithLocation`, `NameResolver`, `LocalFSNameResolver` and `TemplateParser` are
    # then ported mechanically, unchanged, on top of them — which is why the replacement is a
    # redirect and not a drop: a drop would take five of liqp's own classes with it.
    #
    #   * `CharStream` -> `CharSource`, java's own nine members at java's own arity, so
    #     `FilterCharStream implements CharStream` ports as written;
    #   * `CharStreams` -> `CharSources`, the four factories liqp calls. A redirect mints a
    #     static twin on the target for every static of the source, so `CharStreams.fromPath(p)`
    #     becomes `CharSources.fromPath(p)` with no call rewrite;
    #   * `IntStream` -> `CharSource`, for the ONE thing liqp reads off it:
    #     `IntStream.UNKNOWN_SOURCE_NAME`, the sentinel `NameResolver.getLocationFromCharStream`
    #     compares a source name against. The stand-in declares the same string, so a template
    #     parsed from a string still resolves to no location;
    #   * `misc.Interval` -> `Interval`, the one argument of `CharStream.getText`;
    #   * `tree.ParseTree` -> `nodes.LNode`, because the replacement parser builds the AST while
    #     it parses. That makes `Template.root` an LNode, `getParseTree()` return one, and the
    #     visitor below an identity;
    #   * the generated `liquid.parser.v4.LiquidLexer` -> the hand-written one, whose constructor
    #     takes java's own six arguments in java's own order, so `Template`'s constructor — which
    #     scala promotes into the class body, where no body substitution can reach it — ports
    #     with no key at all.
    #
    # `liquid.parser.v4.LiquidParser` is NOT redirected: java constructs it inside
    # `Template.parse`, which is a body this port replaces anyway (below), and the replacement
    # parser needs the insertion and filter registries java hands to the visitor instead.
    { transform = "type-redirect"
      redirects {
        "java.util.ServiceLoader"                = "multiarch.serviceloader.ServiceProviders"
        "org.antlr.v4.runtime.CharStream"        = "ssg.liquid.antlr.CharSource"
        "org.antlr.v4.runtime.CharStreams"       = "ssg.liquid.antlr.CharSources"
        "org.antlr.v4.runtime.IntStream"         = "ssg.liquid.antlr.CharSource"
        "org.antlr.v4.runtime.misc.Interval"     = "ssg.liquid.antlr.Interval"
        "org.antlr.v4.runtime.tree.ParseTree"    = "ssg.liquid.nodes.LNode"
        "liquid.parser.v4.LiquidLexer"           = "ssg.liquid.parser.LiquidLexer"

        # THE SAME MECHANISM FOR JACKSON, the other JVM-only library on this port's compile
        # classpath. Twelve jackson types, twelve hand-written stand-ins in `ssg.liquid.json`, and
        # liqp's own `TemplateParser`, `Template`, `filters.Json`, `filters.where.LiquidWhereImpl`,
        # `parser.LiquidSupport` and all five `spi` classes then port MECHANICALLY on top of them —
        # the field stays `public final ObjectMapper mapper`, `getMapper()` still returns it, and
        # `withObjectMapper(…)` still takes one. The reference hand port answered this question by
        # making its own tree type the value type everywhere and DELETING `LiquidSupport`,
        # `Inspectable`, all five `spi` classes, `TemplateParser.mapper` and the String-taking
        # `render` overloads; that is an API redesign, not a jackson replacement, and a port that
        # must keep java's `Object`-typed data model cannot follow it.
        #
        #   * `ObjectMapper` -> `JsonMapper`, java's own six members at java's own arity:
        #     `readValue(String, Class)`, `writeValueAsString`, both `convertValue` overloads,
        #     `copy()`, `registerModule` and `configure`;
        #   * `JsonNode` -> `JsonNode` and `node.ObjectNode` -> `ObjectNode`, for the one thing
        #     liqp asks of a node — `Objects.equals(jsonNode, jsonProperty)` in the `where` filter;
        #   * `module.SimpleModule` -> `SimpleModule` and `ser.std.StdSerializer` -> `StdSerializer`,
        #     so `BasicTypesSupport.registerType`'s anonymous serializer and
        #     `LiquidSupport.LiquidSerializer` both port as written;
        #   * `core.JsonGenerator` -> `JsonGenerator`, which BUILDS a value instead of writing
        #     bytes, because every serializer liqp registers exists to produce a small object
        #     another liqp function reads straight back;
        #   * `SerializerProvider`, `core.type.TypeReference`, `SerializationFeature` and
        #     `jsr310.JavaTimeModule` -> stand-ins that keep java's spelling at the call;
        #   * `core.JsonProcessingException` -> an `IOException` subclass, so `filters.Json`'s own
        #     catch clause needs no body substitution at all.
        "com.fasterxml.jackson.databind.ObjectMapper"           = "ssg.liquid.json.JsonMapper"
        "com.fasterxml.jackson.databind.JsonNode"               = "ssg.liquid.json.JsonNode"
        "com.fasterxml.jackson.databind.node.ObjectNode"        = "ssg.liquid.json.ObjectNode"
        "com.fasterxml.jackson.databind.module.SimpleModule"    = "ssg.liquid.json.SimpleModule"
        "com.fasterxml.jackson.databind.ser.std.StdSerializer"  = "ssg.liquid.json.StdSerializer"
        "com.fasterxml.jackson.databind.SerializerProvider"     = "ssg.liquid.json.SerializerProvider"
        "com.fasterxml.jackson.databind.SerializationFeature"   = "ssg.liquid.json.SerializationFeature"
        "com.fasterxml.jackson.datatype.jsr310.JavaTimeModule"  = "ssg.liquid.json.JavaTimeModule"
        "com.fasterxml.jackson.core.JsonGenerator"              = "ssg.liquid.json.JsonGenerator"
        "com.fasterxml.jackson.core.type.TypeReference"         = "ssg.liquid.json.TypeReference"
        "com.fasterxml.jackson.core.JsonProcessingException"    = "ssg.liquid.json.JsonProcessingException"
      } },

    # THE TWO BODIES THE REDIRECTS ABOVE LEAVE BEHIND, in their own group so they keep their
    # place after the redirect rather than folding into the group `Split.apply` below sits in.
    #
    # `Template.parse` is java's lexer-and-parser wiring: two ANTLR error listeners, a token
    # stream, and a re-parse under a slower prediction mode when the fast one fails. None of it
    # survives the replacement — the hand-written parser has one mode and raises its own
    # `LiquidException` — so the body states what is left: tokenize, parse, hand back the AST.
    # The registries java gives the VISITOR are given to the parser here, because this parser
    # builds the AST as it goes.
    #
    # `Template.toStringTree` printed the ANTLR parse tree by walking its children. An LNode has
    # no children to walk, and the one test that reads it asserts only that the result is not
    # null, so the body answers the root's own `toString`. `walk` and `children`, its two private
    # helpers, are dropped below — they exist only to feed it.
    { transform = "method-body"
      group = "antlr"
      bodies {
        "liqp.Template#parse" = """{
  val tokens: java.util.ArrayList[ssg.liquid.parser.Token] = lexer.tokenize()
  val parser: ssg.liquid.parser.LiquidParser = new ssg.liquid.parser.LiquidParser(
    tokens,
    this.templateParser.insertions,
    this.templateParser.filters,
    this.templateParser.liquidStyleInclude,
    this.templateParser.evaluateInOutputTag,
    this.templateParser.errorMode
  )
  return parser.parse()
}"""
        "liqp.Template#toStringTree" = """{
  return java.lang.String.valueOf(this.root)
}"""

        # THE ONE LINE THAT NEEDED strftime4j, which is a JVM-only artifact.
        #
        # `Date.apply`'s last two statements build a `ua.co.k.strftime.StrftimeFormatter` and format
        # with it; everything above them is java's own date COERCION and is kept verbatim. The
        # replacement evaluates the same Ruby/C strftime pattern
        # (`ssg.liquid.filters.date.Strftime`), so the argument order, the locale and the bare
        # `return value` on an unusable pattern are java's.
        "liqp.filters.Date#apply" = """{
  val locale: java.util.Locale = context.getParser().locale
  // `value$arg` and not `value`: java REASSIGNS the parameter, so the emitter renames it and
  // a body spliced verbatim has to name the parameter as EMITTED
  var subject: java.lang.Object = value$arg
  if (super.isArray(subject) && super.asArray(subject, context).length == 1) {
    subject = super.asArray(subject, context)(0)
  } else ()
  try {
    val compatibleDate: java.time.temporal.TemporalAccessor = {
      val valAsString: java.lang.String = super.asString(subject, context)
      if ("now".equals(valAsString) || "today".equals(valAsString)) java.time.ZonedDateTime.now()
      else if (ssg.liquid.LValue.isTemporal(subject)) ssg.liquid.LValue.asTemporal(subject, context)
      else if (super.isNumber(subject))
        java.time.ZonedDateTime.ofInstant(
          java.time.Instant.ofEpochMilli(super.asNumber(subject).longValue() * 1000L),
          context.getParser().defaultTimeZone
        )
      else context.getDateParser().parse(valAsString, locale, context.getParser().defaultTimeZone)
    }
    if (compatibleDate == null) {
      return subject
    } else ()
    val format: java.lang.String = super.asString(super.get(0, params), context)
    if (format == null || format.trim().isEmpty()) {
      return subject
    } else ()
    return ssg.liquid.filters.date.Strftime.format(format, compatibleDate, locale)
  } catch {
    case _: java.lang.Exception => return subject
  }
}"""
      } },

    # THE FOUR-ARGUMENT `FilterNode` CONSTRUCTOR, SHIPPED PUBLIC.
    #
    # java declares it `private` and reaches it only from the sibling constructor that takes an ANTLR
    # `ParserRuleContext`. The reference port replaces that parser with a hand-written one
    # (`ssg-liquid/src/main/scala/ssg/liquid/parser/LiquidParser.scala`), which has no
    # `ParserRuleContext` to hand over and builds the node from the four values directly — a caller
    # outside the class, which `private` does not reach. The consumer was editing `class FilterNode
    # private (` out of the generated file after every run; this is the same decision stated where the
    # port's policy lives, so the emitted text is right when it is written.
    #
    # WIDENING IS THE WHOLE OF IT: the constructor keeps its parameters, its body and its position as
    # the scala primary (the funnel nominates it because the other constructor delegates to it), and
    # java's own callers are unaffected — a wider member can only remove access errors.
    { transform = "visibility"
      widen = ["liqp.nodes.FilterNode#<init>(int,int,String,Filter)"] },

    # `Split.apply`, WITHOUT THE LOOKBEHIND — the one emitted regex this port cannot run off the JVM.
    #
    # java splits on `"(?<!^)" + Pattern.quote(delimiter)`: the delimiter, except where it sits at
    # index 0. `java.util.regex` on Scala Native has no lookbehind, so the pattern does not compile
    # there at all, and this manifest declares no `targets` — it claims all three platforms. The
    # translation the engine can make is faithful and unrunnable; the answer is this library's own
    # body, because WHICH expression means the same thing without a lookbehind is a fact about this
    # one line and nothing else (CLAUDE.md §1c).
    #
    # It is the SAME SPLIT, rephrased: a match that may not START at index 0 is exactly a match in
    # `original.substring(1)`, so the tail is split on the quoted delimiter alone and the first
    # character is put back on the first piece. `-1` keeps every empty piece, and java's own limit-0
    # rule (drop the TRAILING empties, keep the leading ones) is then restated over the result. An
    # EMPTY delimiter is the one case the shift does not answer — a zero-width match at index 0 is
    # already skipped by `split` itself (java 8), so the plain pattern is java's answer there.
    # `original` is non-empty by the guard above, so `charAt(0)` and `substring(1)` are total.
    #
    # BARE KEY because it is exact: `Split` declares one `apply` and nothing else.
    #
    # `Sort.apply`, FOR ONE ARGUMENT. `Sort$ComparableMapEntry` is scoped out of `collections`
    # above and keeps java's `Map.Entry` constructor parameter, while this body's loop variable is
    # the pair the retyped map hands out — a seam the engine counts and does not bridge (one typer
    # error). The body is the emitted one, verbatim, with the pair handed over as the java entry
    # the class expects. BARE KEY because `Sort` declares one `apply`.
    { transform = "method-body"
      bodies {
        "liqp.filters.Sort#apply" = """{
  var value: java.lang.Object = value$arg
  if (value == null) {
    return ""
  } else ()
  val property: java.lang.String = if (params.length == 0) null.asInstanceOf[java.lang.String] else super.asString(params(0), context)
  var array: scala.Array[java.lang.Object] = null.asInstanceOf[scala.Array[java.lang.Object]]
  var wasMap: scala.Boolean = false
  if (balticporter.runtime.JavaCollections.Reified.isMap(value)) {
    if (balticporter.runtime.JavaCollections.Reified.asMap(value).asInstanceOf[scala.collection.mutable.Map[?, ?]].isEmpty) {
      return value
    } else ()
    val list: scala.collection.mutable.Buffer[java.lang.Object] = new scala.collection.mutable.ArrayBuffer[java.lang.Object]()
    for (en <- balticporter.runtime.JavaCollections.entrySetView(balticporter.runtime.JavaCollections.Reified.asMap(value).asInstanceOf[scala.collection.mutable.Map[java.lang.Object, java.lang.Object]])) {
      list += new ssg.liquid.filters.Sort.ComparableMapEntry[java.lang.Object, java.lang.Object](new java.util.AbstractMap.SimpleImmutableEntry[java.lang.Object, java.lang.Object](en._1, en._2))
    }
    value = list
    wasMap = true
  } else {
    if (balticporter.runtime.JavaCollections.Reified.isCollection(value)) {
      if (balticporter.runtime.JavaCollections.Reified.asCollection(value).asInstanceOf[balticporter.runtime.JavaCollection[?]].isEmpty) {
        return value
      } else ()
    } else ()
  }
  if (!super.isArray(value)) {
    throw new java.lang.RuntimeException((("cannot sort: " + value) + "; type:") + (if (value == null) "null" else value.getClass()))
  } else ()
  array = super.asArray(value, context)
  val list: scala.collection.mutable.Buffer[java.lang.Comparable[java.lang.Object]] = this.asComparableList(context, array, property)
  balticporter.runtime.JavaCollections.sortNatural(list)
  if (wasMap) {
    val map: scala.collection.mutable.LinkedHashMap[java.lang.Object, java.lang.Object] = new scala.collection.mutable.LinkedHashMap[java.lang.Object, java.lang.Object]()
    for (en <- list.asInstanceOf[scala.collection.mutable.Buffer[?]].asInstanceOf[scala.collection.mutable.Buffer[ssg.liquid.filters.Sort.ComparableMapEntry[java.lang.Object, java.lang.Object]]]) {
      map.put(en.getKey(), en.getValue())
    }
    return map
  } else ()
  return if (property == null) balticporter.runtime.JavaCollections.toArray(list, new scala.Array[java.lang.Comparable[?]](list.size)) else balticporter.runtime.JavaCollections.toArray(list, new scala.Array[ssg.liquid.filters.Sort.SortableMap](list.size))
}"""
        "liqp.filters.Split#apply" = """{
  val original: java.lang.String = super.asString(value, context)
  if (original.isEmpty()) {
    return new scala.Array[java.lang.String](0)
  } else ()
  val delimiter: java.lang.String = super.asString(super.get(0, params), context)
  val quoted: java.lang.String = java.util.regex.Pattern.quote(delimiter)
  val pieces: scala.Array[java.lang.String] =
    if (delimiter.isEmpty()) original.split(quoted, -1)
    else {
      val tail: scala.Array[java.lang.String] = original.substring(1).split(quoted, -1)
      tail(0) = original.charAt(0).toString + tail(0)
      tail
    }
  var kept: scala.Int = pieces.length
  while (kept > 0 && pieces(kept - 1).isEmpty()) { kept = kept - 1 }
  return pieces.take(kept)
}"""
      } },
  ]

  # D-liqp-10: the one external callee this port can answer for.
  #
  # `ExternalCallee` counts a slot whose other side is a compiled class file: the frontend interned
  # `Objects.requireNonNull` with NO signature, so the check has no formal to compare and says so —
  # "Required unknown". That is a CANNOT-VERIFY count and not a defect, which is exactly the shape a
  # per-location remedy exists for: the engine cannot read the class file, and a reader can read the
  # SPECIFICATION. `requireNonNull` throws NPE for a null reference and otherwise RETURNS THE SAME
  # REFERENCE — it neither inspects nor converts what it is handed. So both halves of every row it
  # produces are answered by the method's own contract: nothing crosses at the argument, and the
  # "unverified pass-through" result is the very value that went in, which is this port's own
  # retyped collection.
  #
  # BARE because it is EXACT: every call liqp makes is the one-argument overload, and a bare key
  # names the whole set. It used to be bare because it had to be — an external callee's row prints
  # `Symbol.fullName`, which the frontend interns with FULLY QUALIFIED parameters, while a
  # `Descriptor` is SIMPLE names, so a precise key copied out of the report matched NOTHING. The
  # binder compares descriptors through `Descriptor.matches` now (simple names on both sides), so
  # either spelling binds and this is a choice rather than a workaround.
  #
  # It is the ONLY entry: the other rows in this lane are a `HashMap` handed to an external
  # constructor and to jackson's `readValue`, and neither of those is a method whose contract says
  # it leaves the value alone.
  resolutions { "java.util.Objects#requireNonNull" = "accept-external-callee" }

  # DECISION D-liqp-13 — THE ARTIFACTS THIS MODULE'S BUILD ADDS, which is what a `Verdict.Depend`
  # is answered WITH (CLAUDE.md §1.5).
  #
  # This manifest declares no `targets`, so it claims all three, and 101 sites of this port's own
  # emitted code call an API that EXISTS off the JVM in an artifact nobody had named: 99 of them
  # `java.time.*` (`ZonedDateTime`, `ZoneId`, `Instant`, the whole `temporal` and `format`
  # families) and 2 `java.text.DecimalFormat`, plus `java.util.Locale`. `dependency-coverage`
  # reported every one of them on every run of this port since the lane existed, and the reader's
  # action was never to remove a call — it was this key.
  #
  # TWO entries and not three: `scala-java-time-tzdb` is what `ZoneId.of(String)` needs (the whole
  # IANA database, `JS-L63`), and this source set never calls it — the SUITE does, and declares it
  # itself. An entry naming an artifact no requirement here wants is a `policy` finding of its own
  # now, which is what keeps this list honest in the other direction.
  #
  # `cross = "platform"` because that is what these artifacts ARE: `scala-java-time_sjs1_3` and
  # `scala-java-time_native0.5_3` are published beside `scala-java-time_3`, so `%%` would ask a JS
  # build for the JVM jar. The versions are the catalog's surveyed ones; the check matches on
  # organisation and NAME and never on the revision, so pinning another one is this port's business.
  # THREE entries since D-liqp-12: `multiarch-serviceloader` is what `java.util.ServiceLoader`'s row
  # now answers with on both non-JVM backends, and it is the artifact the two surface entries above
  # redirect INTO — so the declaration and the redirect are one decision written in the two places
  # that can act on it. It is the corpus's first coordinate needing a `resolver`: multiarch-scala
  # publishes to the Central Portal SNAPSHOT repository and to no release repository, so a build
  # naming the coordinate alone resolves nothing. The revision is provisional until that repository's
  # next release, which the catalog row says at the coordinate it recommends.
  dependencies = [
    { org = "io.github.cquiroz", name = "scala-java-time",    rev = "2.6.0", cross = "platform" },
    { org = "io.github.cquiroz", name = "scala-java-locales", rev = "1.5.4", cross = "platform" },
    { org = "com.kubuszok",      name = "multiarch-serviceloader", rev = "0.4.0-12-gc168b2f-SNAPSHOT",
      cross = "platform", resolver = "https://central.sonatype.com/repository/maven-snapshots" },
  ]

  # The reference hand port for ssg-liquid. The hand-written liqp port lives in ssg's own tree.
  # Not inherited: comparing against a hand port is per-library policy, and empty policy is a
  # no-op.
  parity { roots = ["@consumer/ssg-liquid/src/main/scala"] }
}

# `LICENSE`: "MIT License, Copyright (c) 2010-2013 by Bart Kiers"; `NOTICE` names the project and
# the same holder. A port is a derived work, so every emitted file carries the banner — and this
# library is the corpus's first where the banner is NOT enough (CLAUDE.md §4.57). liqp carries ZERO
# per-file headers, so those two files are the only home of the copyright and permission notice,
# and MIT's one condition is that the notice be INCLUDED in copies. `notices` copies them beside the
# emitted code (`liqp-core/src_managed/`), which is where this port's derived work lives.
provenance {
  upstreamName     = "liqp"
  originalLicense  = "MIT"
  sourcePathPrefix = "src/main/java"
  # `upstreamCommit` is omitted on purpose: derived from the vendored tree's own git state, which
  # is the only value that cannot go stale. Note liqp is a git SUBMODULE of ssg, so that state is
  # the submodule's.
  #
  # Relative to THIS FILE, like every other path here — the upstream ROOT, four directories above
  # the source root this port parses. A declared file that is not there is fatal.
  notices = [
    "@consumer/original-src/liqp/LICENSE",
    "@consumer/original-src/liqp/NOTICE",
  ]
}

# A single source set compiled standalone by `scala-cli`: the support types the collections phase
# retypes onto ship beside the emitted code. Same reason as simple-graphs — there is no second
# module of this port yet to carry them.
runtimeMode = "vendored"

nextStep = "just liqp-measure"
