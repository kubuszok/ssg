# -------------------------------------------------------------------------------------------
# ssg-md's EXTENSION half — MILESTONE 2, as ONE dependent port of `main.conf`.
#
# flexmark ships 29 covered `flexmark-ext-*` maven modules (386 java files) on top of the twelve
# milestone 1 converts. Every one of them declares under `com.vladsch.flexmark.ext.*`, resolves
# against the base's JAVA and against nothing else, and lands in the reference hand port's ONE
# `ssg-md` module at `ssg.md.ext.*` — `../ssg/ssg-md/src/main/scala/ssg/md/ext/` holds twenty-five
# such packages side by side. So this is not 29 modules; it is one module's other half.
#
# ==DECISION D-mde-1 — WHY ONE PORT AND NOT TWENTY-NINE==
#
# The emission identity of a run is the PAIR (`portRoot`, `sourceSet`), and `PortRun` opens its
# emission with an unconditional `wipe(emitDir)`: a second run at the same pair does not merge with
# the first, it DELETES it. `SourceSet` is `main | test` and nothing else, so `ported/ssg-md` has
# exactly two emission slots and `main.conf`/`test.conf` hold both.
#
# Three shapes were available and two of them are wrong:
#
#   * 29 confs at 29 port roots (`ported/ssg-md-ext-tables`, …). Twenty-nine baselines, twenty-nine
#     report identities and twenty-nine `measure-all` lanes for a destination that is ONE sbt module
#     — and CLAUDE.md §2.1 is explicit that a port is named for its destination, so twenty-nine
#     names for modules `../ssg/build.sbt` does not have is exactly the "two different answers to
#     one question" that rule exists to refuse;
#   * widening `main.conf`'s `includeGlobs` to 872 files. That is not a dependent port at all: it
#     abolishes the CLAUDE.md §1.5 relationship this milestone exists to exercise, and it moves the
#     census this milestone measures against;
#   * ONE dependent port whose scope is the extension modules, at its own port root. That is this
#     file. Milestone 2's waves ADD `includeGlobs` lines; nothing else about the port moves, the
#     report identity (`FlexmarkExtMigrate`) never moves, and the baseline is one baseline that
#     grows.
#
# ==DECISION D-mde-2 — WHY `ported/ssg-md-ext` IS AN HONEST NAME==
#
# It names the DESTINATION (`ssg-md`) and which half of it (`-ext`); it does not claim a module ssg
# does not have. `src_managed/` is gitignored on every port, so the tree is a build product either
# way, and the two trees are DISJOINT BY PACKAGE — the base emits `ssg.md.{ast,parser,html,
# formatter,util}` and this emits `ssg.md.ext.*` — so ssg-md's build overlays them exactly as it
# already overlays `src_managed/main/scala` and `src/`. The alternative is a name that promises a
# module and delivers a source directory.
#
# ==DECISION D-mde-3 — WHAT MILESTONE 2 INHERITS, AND WHAT IT MUST NOT RESTATE==
#
# `base = "main.conf"` (CLAUDE.md §1.5). `packageRenames`, `governs` and both surface phases arrive
# from the base as ONE instance, so there is no `surfaceFold` to perform and no `SurfaceDivergence`
# to risk: the effective surfaces agree by construction, which is the answer CLAUDE.md §1.5 gives when the
# question is "does any dependent CONSTRUCT this phase?" and the answer is no. Everything under
# `input`, `output`, `provenance` and `runtimeMode` is a fact about THIS module's build and is
# deliberately its own.
#
# Paths are relative to THIS FILE, like `main.conf`'s and `test.conf`'s.
# -------------------------------------------------------------------------------------------

# see `main.conf`: the same three roots
roots {
  consumer = "../.."
  work     = "../../target/balticporter-work"
  ports    = "../../target/balticporter"
}

label = "ssg-md-ext"
base  = "main.conf"

input {
  # `main.conf` D-md-1's root, for D-md-1's reason: flexmark is 53 maven modules all declaring under
  # one package root, so no single directory is both a package root and a scope boundary, and the
  # root is the checkout with `includeGlobs` stating the scope.
  #
  # `PortRun.converted` reads the run's own INPUT LIST (`FrontendConfig.files`) rather than a path
  # prefix (CLAUDE.md §4.56), so ownership here is exactly the glob below — which is what makes a
  # nested source root and resolution root expressible at all.
  sourceRoot = "@consumer/original-src/flexmark-java"

  # DECISION D-mde-4 — THE FIRST EXTENSION IS `flexmark-ext-aside`, AND THE CHOICE IS ARGUED.
  #
  # Milestone 2 is 29 modules and this is the one that establishes the pattern, so it is picked for
  # what it PROVES rather than for what it ports:
  #
  #   * SMALL — 10 java files, 8 of them declaring a type (two `package-info.java`, dropped by the
  #     loader's default). The smallest scope that still has the shape;
  #   * THE CANONICAL EXTENSION SHAPE, entire. `AsideExtension` (the `Parser.ParserExtension` +
  #     `HtmlRenderer.HtmlRendererExtension` + `Formatter.FormatterExtension` registration triple),
  #     `AsideBlockParser` (+ its `BlockParserFactory` and `CustomBlockParserFactory`),
  #     `AsideNodeRenderer` (+ `NodeRendererFactory`), `AsideNodeFormatter` (+ `NodeFormatterFactory`),
  #     `AsideOptions`, the `AsideBlock` AST node and the `AsideVisitor`/`AsideVisitorExt` pair.
  #     Every other extension is a permutation of those seven, so what compiles here is what the
  #     batch waves are made of;
  #   * MILESTONE 2a — no `flexmark-ext-*` import anywhere. Verified over every `import` in the
  #     module: `com.vladsch.flexmark.{ast,formatter,html,parser}` and six `util` packages, all
  #     twelve of them the base's, plus `java.util` and the annotations jar;
  #   * NO `*JiraRenderer`. Eight extensions ship one, and `flexmark-jira-converter` is out of scope
  #     for this milestone AND one of the reference hand port's 28 undocumented omissions — a scope
  #     question the batch waves have to answer and the first extension should not be answering;
  #   * A FREE-STANDING PLAIN `@Test`. `AsideParserTest` imports `Parser`, `BasedSequence` and
  #     `SpecialLeadInHandler` and nothing else — so `ext-test.conf` can run behaviour against the
  #     BASE's main source set alone, without dragging `flexmark-test-util` (which lives in
  #     `test.conf`'s source set) into a third base chain on the wave that is establishing the
  #     pattern. Its other three test files are `ComboSpecTestCase` subclasses — the documented
  #     `@RunWith(Parameterized.class)` refusal — and are not in scope.
  #
  # ENUMERATED per module, never `flexmark-ext-*/src/main/java/**.java`, for `main.conf` D-md-2's
  # reason: a glob would silently admit the three modules with no coverage in the reference hand port
  # (`spec-example`, `xwiki-macros`, `zzzzzz`) and the four milestone-2b modules whose siblings have
  # to precede them, and a scope nobody can read off the file is a scope that drifts. THE DAY A
  # MODULE JOINS THIS PORT IT JOINS THIS LIST, and the diff says so — which is the whole of the
  # batch recipe.
  # ADDED IN ASCENDING SIZE ORDER, and that is a batching rule with a reason: the smallest module
  # that still has the canonical shape surfaces an engine gap at the lowest cost per gap, and a wave
  # that stalls stalls on four files rather than on twenty-eight.
  includeGlobs = [
    "flexmark-ext-aside/src/main/java/**.java",
    "flexmark-ext-resizable-image/src/main/java/**.java",
    "flexmark-ext-youtube-embedded/src/main/java/**.java",
    "flexmark-ext-anchorlink/src/main/java/**.java",
    "flexmark-ext-escaped-character/src/main/java/**.java",
    # THE FIRST MODULE IN THIS PORT WITH A `*JiraRenderer`, and what happens to it is: it PORTS.
    # Each wave says so, because eight of the 29 ship one and
    # `flexmark-jira-converter` is both out of scope and one of the reference hand port's 28
    # undocumented omissions. The question that matters is which of the two shapes a module has, and
    # it is answered by the IMPORTS rather than by the file name: `InsJiraRenderer` imports
    # `com.vladsch.flexmark.{html,util.data}` and nothing else — no `com.vladsch.flexmark.jira`, no
    # coordinate — so it is an ordinary `NodeRenderer` that this port converts with the rest of the
    # module, and the scope question the converter module raises is not raised here.
    "flexmark-ext-ins/src/main/java/**.java",
    "flexmark-ext-superscript/src/main/java/**.java",
    "flexmark-ext-gfm-issues/src/main/java/**.java",
    # THE ONLY MODULE IN THE COVERED 29 WITH A THIRD-PARTY COMPILE DEPENDENCY —
    # `org.nibor.autolink:autolink:0.6.0`, declared in this module's own pom `<properties>`. It is
    # DECLARED rather than routed around; see D-mde-6 below and `manifest.dependencies`.
    "flexmark-ext-autolink/src/main/java/**.java",
    # BATCH 2 — the middles. The `*JiraRenderer` question takes batch 1's answer (`ext-ins` above)
    # every time it recurs, read off the IMPORTS: `GfmUsersJiraRenderer` imports
    # `com.vladsch.flexmark.{html,util.data}` and nothing else, so it PORTS.
    "flexmark-ext-gfm-users/src/main/java/**.java",
    "flexmark-ext-admonition/src/main/java/**.java",
    # …AND ITS 2b SIBLING FOLLOWS IT, which is the one place batch 2's ascending order bends. This
    # batch calls `jekyll-front-matter` a milestone-2b module *after its own sibling*: its POM depends on
    # `flexmark-ext-yaml-front-matter` (and its `src/main/java` imports nothing from it — the
    # dependency is real only in its test set, which this port does not take). Under one port the
    # ordering is a batching HINT and not a constraint, and it is honoured here anyway so the
    # sequence reads the same as the milestone does.
    "flexmark-ext-yaml-front-matter/src/main/java/**.java",
    "flexmark-ext-jekyll-front-matter/src/main/java/**.java",
    # THIS MODULE IS BACK, at the position size gives it. It was measured and taken
    # out once: the constructor replay of `super(block)` could not write the four `private` fields
    # `ListItem(ListItem)` assigns, so the WHOLE super call was dropped and every `TaskListItem`
    # arrived with no children, no `markerSuffix` and no chars, at 0 errors and every count green.
    # The base now widens what a cross-module replay of its own constructors needs
    # (`CtorFunnel.externalReplayWidenings`), so the replay lands and the emitted secondary carries
    # all eight statements.
    "flexmark-ext-gfm-tasklist/src/main/java/**.java",
    "flexmark-ext-jekyll-tag/src/main/java/**.java",
    # THE SECOND MILESTONE-2b MODULE, and the first whose sibling dependency is a real SOURCE one:
    # `AbbreviationNodePostProcessor` imports `com.vladsch.flexmark.ext.autolink.internal
    # .AutolinkNodePostProcessor`, which batch 1 put in scope. Under one port that is a reference
    # inside this run's own scope and nothing more.
    "flexmark-ext-abbreviation/src/main/java/**.java",
    "flexmark-ext-footnotes/src/main/java/**.java",
    "flexmark-ext-definition/src/main/java/**.java",
    "flexmark-ext-typographic/src/main/java/**.java",
    # The batch's fifth `*JiraRenderer` and the batch's answer again, read off the IMPORTS:
    # `EmojiJiraRenderer` names `com.vladsch.flexmark.{html,util.data}` and no `…flexmark.jira`, so it
    # is an ordinary `NodeRenderer` and it PORTS.
    "flexmark-ext-emoji/src/main/java/**.java",
    # BATCH 3 — the large end. `gitlab` PRECEDES `macros` although it is two files bigger, and
    # that is the one place ascending size bends here: `MacrosExtension` imports
    # `com.vladsch.flexmark.ext.gitlab.GitLabExtension`, which under one port is a reference inside this
    # run's own scope and nothing more — but only once the scope contains it.
    # No `*JiraRenderer` and no test file declaring a plain `@Test`.
    "flexmark-ext-gitlab/src/main/java/**.java",
    # …and its sibling follows it. `MacrosExtension` imports `ext.gitlab.GitLabExtension`, admitted
    # one wave above, so this is milestone 2b's shape on a REAL source dependency for the third time.
    # `MergeMacrosTest` is an admissible plain `@Test` file by the pair predicate and joins `ext-test.conf`.
    "flexmark-ext-macros/src/main/java/**.java",
    # Back to ascending size. No cross-extension import and no `*JiraRenderer`; its two test files are a
    # `ComboSpecTestCase` subclass and a `@RunWith(Suite.class)` aggregator, so `tests —`.
    "flexmark-ext-wikilink/src/main/java/**.java",
    # The batch's SIXTH `*JiraRenderer` and the answer batch 1 established, read off the IMPORTS:
    # `StrikethroughJiraRenderer` names `com.vladsch.flexmark.{html,util.data}` and no
    # `…flexmark.jira`, so it is an ordinary `NodeRenderer` and it PORTS — and so does the
    # `StrikethroughYouTrackRenderer` beside it, which is the same shape at a different markup.
    # One maven module, TWO extensions: `StrikethroughExtension`, `SubscriptExtension` and the
    # `StrikethroughSubscriptExtension` that registers both. `tests —`.
    "flexmark-ext-gfm-strikethrough/src/main/java/**.java",
    # Four AST nodes over one `AbstractMediaLink` base and a single post-processor. No cross-extension
    # import, no `*JiraRenderer`, and `tests —`: the module ships one `ComboSpecTestCase` subclass
    # and one `@RunWith(Suite.class)` aggregator.
    "flexmark-ext-media-tags/src/main/java/**.java",
    # …AND ITS 2b SIBLING FOLLOWS IT: `enumerated-reference` imports `ext.attributes`, and ascending
    # size already puts them in that order. `MergeAttributesTest` is admissible by the pair predicate
    # and joins `ext-test.conf`.
    "flexmark-ext-attributes/src/main/java/**.java",
    # The batch's SEVENTH `*JiraRenderer` and the same answer, read off the IMPORTS: `TableJiraRenderer`
    # names `com.vladsch.flexmark.{html,util.data}` and no `…flexmark.jira`, so it PORTS.
    # FIVE admissible plain-`@Test` files by the pair predicate — the largest suite any single extension
    # has contributed — and they join `ext-test.conf`.
    "flexmark-ext-tables/src/main/java/**.java",
    # THE LAST TWO, and the two that were MEASURED AND TAKEN BACK OUT at batch 3 — each at exactly
    # two compile errors and each on a different engine gap, now closed.
    # Both are milestone 2b in the sense that matters: `enumerated-reference` imports
    # `com.vladsch.flexmark.ext.attributes`, which ascending size already put above it. Neither
    # ships a `*JiraRenderer` and neither imports anything outside `com.vladsch.flexmark`, `java.*`
    # and the annotations jar, so `FlexmarkClasspath.Coordinates` does not move.
    #
    # `enumerated-reference` was CLAUDE.md §4.55's fourth face at its second rule: an anonymous
    # `new OrdinalRenderer(this, context, html) { … }` whose body reads a bare `html` that the
    # parent declares as a FIELD. Java binds the inherited member there (probed); scala 3 calls the
    # reference AMBIGUOUS, so what had to move was the enclosing capture, and the pass could not
    # see it because nothing referenced it.
    #
    # `toc` was NOT the generics gap its `E007` looked like: `TocOptionTypes` is an enum
    # implementing `OptionParser<TocOptions>`, and an override across a generic parent instantiated
    # at a concrete argument had no edge in `OverrideGraph` — so `CollectionsTransform` read the
    # member as a CLASS-FILE override and held java's `java.util.List` under a retyped parent.
    # Its five test files are four `ComboSpecTestCase` subclasses and one `@RunWith(Suite.class)`
    # aggregator, so `tests —`.
    "flexmark-ext-enumerated-reference/src/main/java/**.java",
    "flexmark-ext-toc/src/main/java/**.java",
  ]

  # DECISION D-mde-5 — THE RESOLUTION ROOTS ARE THE BASE'S TWELVE, ENUMERATED.
  #
  # `test.conf` D-mdt-2's list verbatim and for its reasons: it is the same set of modules, a glob
  # would admit `flexmark-util-experimental`, and — since D-mde-1's source root is the checkout that
  # CONTAINS these — this enumeration is also the statement of what this run resolves against rather
  # than converts. Nothing here overlaps `includeGlobs` above: no `flexmark-ext-*` module is a
  # `src/main/java` of one of the twelve.
  #
  # This is CLAUDE.md §1.5's own sentence in config: an extension resolves against the base module's JAVA,
  # never against the Scala that port emitted.
  resolutionRoots = [
    "@consumer/original-src/flexmark-java/flexmark/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-ast/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-builder/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-collection/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-data/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-dependency/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-format/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-html/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-misc/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-options/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-sequence/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-visitor/src/main/java",
  ]

  # `main.conf` D-md-3's one jar. Every `flexmark-ext-*` pom inherits the same compile-scope
  # `org.jetbrains:annotations`, and the extension sources import `@NotNull`/`@Nullable` exactly as
  # the base's do — an annotation SPOON cannot resolve does not fail, it resolves WRONGLY
  # (CLAUDE.md §5.1). Written by `FlexmarkClasspath`, shared with the base rather than re-resolved,
  # so the two halves of one module cannot be modelled against two different jars.
  classpathCoordinates = ["org.jetbrains:annotations:24.0.1", "org.nibor.autolink:autolink:0.6.0"]
  classpathFile = "@work/flexmark-classpath.txt"
}

output {
  # D-mde-2. NOT `ported/ssg-md`: that port root's two emission slots are taken, and a third run
  # there would delete one of them (D-mde-1).
  portRoot  = "@ports/ssg-md-ext"
  sourceSet = "main"
}

manifest {
  # `label` and `manifest.name` take the same value (CLAUDE.md §2.1) — `label` is what `PortRun`
  # writes as `module=` into this port's own published map, and `name` is what anything declaring
  # THIS as a base would match. Everything else the manifest needs — `governs`, `packageRenames` and
  # both surface phases — arrives from `base` and is deliberately not restated (D-mde-3).
  #
  # NO `dropTypes`, `dropMethods` or `inject`: this module declares nothing about the base's surface,
  # which is what keeps `SurfaceIntrusion` silent for the right reason rather than by luck.
  name = "ssg-md-ext"

  # What this module's emitted code READS at run time and the build must therefore ship (CLAUDE.md
  # §1(b), `PortManifest.resources`): `AdmonitionExtension.<clinit>` opens `/images/adm-*.svg` through
  # `getResourceAsStream` — a null stream there is an NPE in a class initialiser (2026-09-05).
  resources = [
    { root  = "@consumer/original-src/flexmark-java/flexmark-ext-admonition/src/main/resources"
      files = ["admonition.css", "admonition.js",
               "images/adm-abstract.svg", "images/adm-bug.svg", "images/adm-danger.svg",
               "images/adm-example.svg", "images/adm-fail.svg", "images/adm-faq.svg",
               "images/adm-info.svg", "images/adm-note.svg", "images/adm-quote.svg",
               "images/adm-success.svg", "images/adm-tip.svg", "images/adm-warning.svg"] }
  ]

  # ==DECISION D-mde-6 — THE ONE THIRD-PARTY DEPENDENCY IS **DECLARED**, NOT ROUTED AROUND==
  #
  # `flexmark-ext-autolink` is the only module in the covered 29 that imports anything outside
  # `com.vladsch.flexmark`, `java.*` and the annotations jar: `org.nibor.autolink.{LinkExtractor,
  # LinkSpan, LinkType}`, at `0.6.0`, pinned in that module's own pom `<properties>` (the parent pom
  # manages nothing for it). The reference hand port dropped the module and substituted a regex;
  # this port does not, and the reasons are `CLAUDE.md`'s rather than taste:
  #
  #   * CLAUDE.md §1.5 — "a `Verdict.Depend` finding is answered by DECLARING the artifact … never by
  #     rewriting a call the dependency makes correct". Rewriting `LinkExtractor` as a regex is a
  #     DIFFERENT PROGRAM: autolink implements a scanner with URL/WWW/EMAIL modes, bracket balancing
  #     and trailing-punctuation rules that a pattern does not have, and there is no instrument in
  #     this repository that would report the divergence — the port would compile, every count would
  #     be flat, and the emitted links would differ from java's on inputs nobody enumerated;
  #   * CLAUDE.md §3.5 — a hand port ADJUSTS EVERY CALLER BY HAND and may therefore substitute; a
  #     mechanical port may not read that freedom as its own option. That reading has already been
  #     measured wrong once on this corpus (27 -> 47 errors).
  #
  # `DependencyCheck`'s 2×2 is what makes this legible rather than an assertion: the ORIGINAL
  # program references the artifact and so does the EMITTED one, so the cell is `covered` and the
  # entry KEEPS — read from the jar's own class list, never derived from the coordinate string
  # (CLAUDE.md §4.56 at a build coordinate). `SbtGen` writes it into the generated `libraryDependencies`.
  #
  # `cross = "java"` because it is a plain java artifact — `%`, not `%%`.
  #
  # ==WHAT THIS PORT IS NOT SAYING, and it is a residue rather than a claim==
  # `autolink` is published for the JVM ONLY: one jar, no Scala.js or Native cross-build. This
  # module inherits the all-platform default (CLAUDE.md §1.5: sge and ssg target every platform
  # wherever possible), so the port now DECLARES a JVM-only artifact while claiming three platforms — and
  # nothing in the engine reports that, because `ArtifactDep` carries a `CrossKind` and no
  # per-platform availability at all. That is the SECOND instance on this port and the first that
  # cannot be argued away by changing the emission: the first is `org.jetbrains:annotations`
  # (`Justfile` `md_deps` states it), which is a MARKER the port arguably should not emit, while
  # this is library code the port genuinely calls. Narrowing `targets` here is deliberately NOT the
  # answer — it is a whole-PORT key covering every extension, and setting it to `[jvm]` would empty
  # the rule list for all of them and collapse `portability(emitted)` 3 -> 0 in one commit, which is
  # CLAUDE.md §1(b)'s "fifteen baselines improving to zero" at this port's scale. This port's own
  # issue tracker holds it as a residue with both instances named.
  dependencies = [
    { org = "org.nibor.autolink", name = "autolink", rev = "0.6.0", cross = "java" },
  ]

  # The reference hand port for ssg-md-ext. The hand-written flexmark extensions also live in ssg's
  # ssg-md tree. Not inherited: comparing against a hand port is per-library policy, and empty
  # policy is a no-op.
  parity { roots = ["@consumer/ssg-md/src/main/scala"] }
}

# BSD-2-Clause, `main.conf` D-md-6's decision restated because `provenance` is a fact about THIS
# module's build and is NOT inherited (CLAUDE.md §1.5). flexmark-java carries zero per-file licence
# headers, so the emitted banner naming the licence is a POINTER and the notice itself has to be
# shipped; this port is a derived work of the same original and ships the same bytes to its own
# `src_managed/`, so running it alone in a fresh checkout is compliant on its own.
provenance {
  upstreamName     = "flexmark-java"
  originalLicense  = "BSD-2-Clause"
  # D-md-6's prefix verbatim: D-mde-1's root is the same checkout, so a relativised origin already
  # reads `flexmark-ext-aside/src/main/java/com/vladsch/…` and one segment restores the checkout
  # directory.
  sourcePathPrefix = "flexmark-java"
  notices = [
    "@consumer/original-src/flexmark-java/LICENSE.txt",
  ]
}

# NOT `vendored`, unlike the base. `main.conf` is `RuntimeMode.Vendored` and its support types live
# in `ported/ssg-md/src_managed/main/scala`, which this source set is compiled beside; vendoring
# again would define every support type twice — tolerated by the JVM only while the copies agree and
# rejected outright by the Scala.js and Native linkers. It is also CLAUDE.md §1's rule: only a BASE can ship a
# support type, because a dependent inheriting a `RequiresRuntime` phase through `surface` cannot
# vendor one without defining all of its base's shims a second time.
runtimeMode = "dependency"

nextStep = "just md-ext-measure"
