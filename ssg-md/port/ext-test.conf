# -------------------------------------------------------------------------------------------
# ssg-md's EXTENSION half — THE BEHAVIOURAL GATE, and it is the point of the milestone.
#
# `ext.conf` compiles at 0 errors, and `CLAUDE.md` §3 says exactly what that is worth: the count is
# typer-only, and every one of CLAUDE.md §4.4's java forms translates to VALID Scala meaning
# something else. An extension is a REGISTRATION mechanism — a `ParserExtension` handed to a
# builder, a factory added to a list, a handler consulted in a loop — and every one of those failure
# modes is silent. A parser built with an extension that registered nothing produces perfectly good
# output for the ninety-nine documents that do not use it, which is the same silent-registration
# failure read at a library's own extension point.
#
# ==THE ONE TEST, AND WHY IT IS THE RIGHT ONE==
#
# `flexmark-ext-aside/src/test/java` holds four files. Three are `ComboSpecTestCase` subclasses —
# `@RunWith(Parameterized.class)`, a documented refusal needing a hand-written driver rather than an
# engine change — plus one `@RunWith(Suite.class)` aggregator. The fourth,
# `AsideParserTest`, is a plain `@Test` and is squarely inside `TestFrameworkTransform`'s reach.
#
# It is also, by luck this file should not pretend is design, the exact test this wave wants: it
# BUILDS a `Parser` with `AsideExtension.create()` registered, pulls
# `Parser.SPECIAL_LEAD_IN_HANDLERS` back out of the built options, and round-trips `escape`/`unEscape`
# through the handlers it finds there. So it asserts that the registration the extension performs
# through the BASE's builder actually took — which is the CLAUDE.md §1.5 question ("is the shared surface the
# base emitted one a third party can implement against?") asked of behaviour rather than of a
# signature. `Collections.singleton`, two method references and a `for` over a `List` come with it.
#
# ==DECISION D-mdet-1 — IT RESOLVES AGAINST THE BASE'S MAIN, AND NOT AGAINST `test.conf`'S SET==
#
# `flexmark-test-util` is `test.conf`'s scope (its D-mdt-4), and most extension suites extend
# `RenderingTestCase` from it. This file's one test imports `Parser`, `BasedSequence`,
# `SpecialLeadInHandler` and `org.junit` and nothing else — verified over every import — so it needs
# no third base chain and no second emitted test tree on the compile line. That is why it is the test
# this wave runs and the extension whose test it is was chosen for it (`ext.conf` D-mde-4). The waves
# that admit an extension whose plain `@Test`s DO extend `flexmark-test-util` will have to add
# `ported/ssg-md/src_managed/test/scala` to this lane's compile, and that is a decision with a
# measurement rather than a line to add quietly.
#
# A DEPENDENT of `ext.conf`, which is itself a dependent of `main.conf` — the corpus's first
# THREE-LINK base chain. It inherits `packageRenames`, `governs` and both surface phases through two
# hops rather than restating them (`CLAUDE.md` §1.5); everything under `input`, `output`,
# `provenance` and `runtimeMode` is a fact about THIS source set's build and is deliberately its own.
# -------------------------------------------------------------------------------------------

# see `main.conf`: the same three roots
roots {
  consumer = "../.."
  work     = "../../target/balticporter-work"
  ports    = "../../target/balticporter"
}

label = "ssg-md-ext-test"
base  = "ext.conf"

input {
  # `main.conf` D-md-1's root, for its reason and for `ext.conf` D-mde-1's: 53 maven modules under
  # one package root, so the root is the checkout and `includeGlobs` states the scope.
  sourceRoot = "@consumer/original-src/flexmark-java"

  # ENUMERATED TO THE FILE, and that is the same decision `test.conf` D-mdt-5 makes about
  # `flexmark-core-test`: a directory here would admit the three `ComboSpecTestCase` subclasses and
  # the `@RunWith(Suite.class)` aggregator beside them, which would put their `@Test`s in
  # `test_discovery_guard`'s denominator and report a SCOPE DECISION as tests the port lost — the one
  # failure that guard must not have.
  #
  # They contribute ZERO either way (a `@RunWith(Parameterized)` combo suite declares its examples as
  # data, and the aggregator declares no `@Test` at all), which is exactly why the honest thing is to
  # keep them out of the scope rather than to rely on the arithmetic.
  # THE PAIR PREDICATE: a file is
  # admissible iff it declares a plain `@Test` AND imports nothing from
  # `com.vladsch.flexmark.{test,core.test}`. Reading `@RunWith` off the FILE is what fails — a
  # `ComboSpecTestCase`/`RendererSpecTest` subclass inherits its runner from the ANCESTOR and
  # carries no annotation of its own, so the grep answers *admissible* about a class with zero
  # `@Test` in it.
  #
  # `MergeAutoLinkTest` is the second file to pass it, and the first with real volume: 16 plain
  # `@Test`, no `@RunWith`, no `@Ignore`, no `@Rule`, no `@Before`, no superclass, and imports of
  # `Formatter`, `Parser`, `Document`, `DataHolder`/`MutableDataSet` and `org.junit` only. Its
  # sibling `AutolinkTest` has 6 `@Test` and extends `RenderingTestCase`, so it fails the second
  # conjunct and stays out — that is `flexmark-test-util`, which is `test.conf`'s source set and not
  # on this lane's compile (D-mdet-1), and admitting it is its own decision with its own
  # measurement.
  #
  # WHAT IT BUYS is the milestone's whole argument at 16× the volume it had: the extension registers
  # an `AutolinkExtension` through the base's `Parser.Builder`, and these tests then MERGE several
  # parsed documents through a `Formatter` and assert the markdown that comes out. A registration
  # that did not take, or a `DataHolder` key the port renamed, fails them.
  includeGlobs = [
    "flexmark-ext-aside/src/test/java/com/vladsch/flexmark/ext/aside/AsideParserTest.java",
    "flexmark-ext-autolink/src/test/java/com/vladsch/flexmark/ext/autolink/MergeAutoLinkTest.java",
    # BATCH 2. Each of these passed BOTH conjuncts of the pair predicate, and the second conjunct is
    # what keeps `flexmark-test-util` off this lane: `YamlFrontMatterTest` declares plain `@Test`
    # and extends `RenderingTestCase`, so it is REFUSED here and is its own decision with its own
    # measurement, not a glob widening.
    "flexmark-ext-admonition/src/test/java/com/vladsch/flexmark/ext/admonition/AdmonitionParserTest.java",
    "flexmark-ext-jekyll-tag/src/test/java/com/vladsch/flexmark/ext/jekyll/tag/MergeJekyllTagTest.java",
    "flexmark-ext-abbreviation/src/test/java/com/vladsch/flexmark/ext/abbreviation/MergeAbbreviationsTest.java",
    "flexmark-ext-footnotes/src/test/java/com/vladsch/flexmark/ext/footnotes/MergeFootnotesTest.java",
    "flexmark-ext-definition/src/test/java/com/vladsch/flexmark/ext/definition/DefinitionParserTest.java",
    "flexmark-ext-macros/src/test/java/com/vladsch/flexmark/ext/macros/MergeMacrosTest.java",
    "flexmark-ext-attributes/src/test/java/com/vladsch/flexmark/ext/attributes/MergeAttributesTest.java",
    "flexmark-ext-tables/src/test/java/com/vladsch/flexmark/ext/tables/TableTextCollectingVisitorTest.java",
    # …AND THE HELPER FOUR OF THEM EXTEND. The pair predicate names the files that DECLARE a
    # plain `@Test`; a class in the SAME test source set that those files extend comes with
    # them, or the emitted suites name a supertype that is not there — measured at
    # 283 × `E008 type MarkdownTableTestBase is not a member of ssg.md.ext.tables`, every one
    # of them in the extension TEST scope and none in main. It declares ZERO `@Test`, so it
    # adds nothing to `test_discovery_guard`'s denominator, and it passes the predicate's
    # SECOND conjunct on its own (`com.vladsch.flexmark.{formatter,parser,util}` and JUnit's
    # assertions, nothing from `com.vladsch.flexmark.{test,core.test}`).
    "flexmark-ext-tables/src/test/java/com/vladsch/flexmark/ext/tables/MarkdownTableTestBase.java",
    "flexmark-ext-tables/src/test/java/com/vladsch/flexmark/ext/tables/MarkdownTableTest.java",
    "flexmark-ext-tables/src/test/java/com/vladsch/flexmark/ext/tables/MarkdownTransposeTableTest.java",
    "flexmark-ext-tables/src/test/java/com/vladsch/flexmark/ext/tables/TableCellOffsetInfoTest.java",
    "flexmark-ext-tables/src/test/java/com/vladsch/flexmark/ext/tables/MarkdownSortTableTest.java",
    # THE LAST MODULE WITH AN ADMISSIBLE FILE, once the last blocking compile issue in this batch
    # closed. 8 plain
    # `@Test`, no `@RunWith`, no superclass, and imports of `Formatter`, `Parser`, `Document`,
    # `DataHolder`/`MutableDataSet`, `org.junit` — and `ext.attributes.AttributesExtension`, which
    # is the module's own 2b dependency and has been in `ext.conf`'s scope since batch 3. Its four
    # siblings are three `ComboSpecTestCase` subclasses and one `@RunWith(Suite.class)` aggregator,
    # all at ZERO `@Test`. `flexmark-ext-toc` contributes nothing here: all five of its test files
    # fail the predicate, four on the second conjunct and the fifth on the first.
    "flexmark-ext-enumerated-reference/src/test/java/com/vladsch/flexmark/ext/enumerated/reference/MergeEnumeratedReferenceTest.java",
  ]

  # THE TWELVE, PLUS THE EXTENSION THIS SUITE IS FOR. `test.conf` D-mdt-2's list and its reasons,
  # with `flexmark-ext-aside/src/main/java` added: this source set resolves against the extension's
  # JAVA exactly as it resolves against the base's, never against the Scala either port emitted, and
  # `PortRun.converted` uses these to say what this run resolves against rather than converts.
  #
  # A WAVE THAT ADDS AN EXTENSION WITH A PLAIN `@Test` ADDS ITS `src/main/java` HERE TOO — one line
  # beside the glob above and the two in `ext.conf`/`md_ext_modules`.
  resolutionRoots = [
    "@consumer/original-src/flexmark-java/flexmark/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-ast/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-builder/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-collection/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-data/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-dependency/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-format/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-html/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-misc/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-options/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-sequence/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-visitor/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-aside/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-autolink/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-admonition/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-jekyll-tag/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-abbreviation/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-footnotes/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-definition/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-macros/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-attributes/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-tables/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-ext-enumerated-reference/src/main/java",
  ]

  # JUnit must be on the FRONTEND's classpath — `test.conf`'s D-mdt-2 note, which is the same file
  # this port reads: an `import static org.junit.Assert.assertEquals` the frontend cannot resolve does
  # not FAIL, it resolves WRONGLY, to an unqualified call on the enclosing test class, and the port
  # then emits nonsense and reports success (`CLAUDE.md` §5.1). Recorded five times in this corpus
  # already. Written by `FlexmarkTestClasspath.ensure`, which derives it from the main one, so the
  # three source sets of this library cannot be modelled against three different jars.
  classpathCoordinates = ["org.jetbrains:annotations:24.0.1", "org.nibor.autolink:autolink:0.6.0", "junit:junit:4.13.2"]
  classpathFile = "@work/flexmark-test-classpath.txt"
}

output {
  # The SECOND emission slot of the extension port root — `ext.conf` D-mde-1's pair. `main` is
  # `ext.conf`'s and this is this file's, which is exactly the two-slot budget `ported/ssg-md`
  # already spends on `main.conf` and `test.conf`.
  portRoot  = "@ports/ssg-md-ext"
  sourceSet = "test"
}

manifest {
  # `label` and `manifest.name` take the same value (`CLAUDE.md` §2.1).
  name = "ssg-md-ext-test"

  # ONE PHASE, and it is a fact about THIS source set. `test.conf` D-mdt-3's argument at a much
  # smaller scope: `TestFrameworkTransform` is JUnit-4-shaped and this file is squarely inside it —
  # one plain `@Test`, no `@RunWith`, no `@Ignore`, no test-class inheritance, no `@Rule`. The two
  # residues that file enumerates are both out of this scope by construction, because the constructs
  # that carry them are in the files D-mdet-1 leaves out.
  #
  # The base chain contributes `governs`, `packageRenames` and the two surface phases; this appends
  # the third rather than restating any of them.
  surface = [
    { transform = "test-framework" },
  ]
}

# BSD-2-Clause, `main.conf` D-md-6 restated because `provenance` is a fact about THIS source set's
# build and is NOT inherited (`CLAUDE.md` §1.5). Same original, same notice, same bytes to this port
# root's own `src_managed/`, so running this source set alone in a fresh checkout is compliant on its
# own.
provenance {
  upstreamName     = "flexmark-java"
  originalLicense  = "BSD-2-Clause"
  sourcePathPrefix = "flexmark-java"
  notices = [
    "@consumer/original-src/flexmark-java/LICENSE.txt",
  ]
}

# The base port is `vendored` and its support types live in `ported/ssg-md/src_managed/main/scala`,
# which every lane below compiles beside this tree. Vendoring again — here or in `ext.conf` — would
# define every support type a third time.
runtimeMode = "dependency"

nextStep = "just md-ext-measure"
