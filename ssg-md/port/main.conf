# -------------------------------------------------------------------------------------------
# ssg-md — flexmark-java 0.64.8, MILESTONE 1: the `flexmark` core module plus the eleven
# `flexmark-util-*` split libraries. 486 java files, of which 28 are `package-info.java` and are
# excluded by the loader's own default (a declaration-only file has no type to emit).
#
# What this port is here to exercise is in `FlexmarkMigrate`'s doc. Milestone 1 is the SKELETON and
# the measured WALL — this port is not expected to compile, and the first census is a number
# classified per CLAUDE.md §1, not an estimate.
#
# Paths are relative to THIS FILE (see `balticporter.runner.PortConfig`), so the port directory is
# relocatable and no system property has to be set for it to resolve. Note flexmark's upstream is a
# vendored tree under **ssg**, not under sge like most of the corpus, so the `..` chain lands on a
# different sibling checkout — the same one liqp reaches.
# -------------------------------------------------------------------------------------------

# This file is ssg's: the build (`project/BalticPorterGen.scala`) hands it to the Baltic Porter
# engine, which holds no knowledge of flexmark. Change the port here, regenerate, run the tests —
# no engine release is involved. Paths are relative to THIS FILE unless they start with a root name.
roots {
  consumer = "../.."                            # this repository: the upstream submodules and the reference port
  work     = "../../target/balticporter-work"   # files the run prepares for itself (resolved classpaths)
  ports    = "../../target/balticporter"        # where the generated code goes
}

label = "ssg-md"

input {
  # DECISION D-md-1 — THE SOURCE ROOT IS THE CHECKOUT, NOT A PACKAGE ROOT.
  #
  # flexmark-java is 53 maven modules, each with its own `src/main/java`, and every one of them
  # declares packages under the SINGLE root `com.vladsch.flexmark`. So there is no one directory
  # that is both a package root and a scope boundary, and the module split is a fact about
  # `pom.xml` files rather than about java. `SpoonTir` adds each file as its own input resource,
  # so a source root that is a plain ancestor is fine — and it is what keeps `PortRun.converted`'s
  # "under `sourceRoot`, not under a `resolutionRoot`" test able to see every module as this run's
  # own (the same shape `VfxMigrate` uses for gdx-vfx's two library modules).
  #
  # A BASE port: nothing is merely resolved against, everything under the globs is converted.
  sourceRoot = "@consumer/original-src/flexmark-java"

  # DECISION D-md-2 — MILESTONE 1'S SCOPE, ENUMERATED RATHER THAN PATTERNED.
  #
  # The twelve modules below are the shared surface every extension depends on: `flexmark` core
  # (209 files — ast, parser, html, formatter) and the eleven `flexmark-util-*` libraries (277).
  # Everything else in the covered scope — 29 `flexmark-ext-*` modules, 386 files — depends on
  # THESE, so this is the module a later milestone's dependent manifests extend (CLAUDE.md §1.5),
  # and porting it first is what keeps the extensions from each restating a shared policy.
  #
  # WRITTEN OUT, and not as `flexmark-util-*/src/main/java/**.java`, for two reasons that are the
  # same reason: a glob would silently admit `flexmark-util-experimental`, which is one of the
  # thirteen modules the reference hand port does not carry at all and which this milestone is
  # deliberately not measuring; and a scope nobody can read off the file is a scope that drifts.
  # The day a module joins the port it joins this list, and the diff says so.
  #
  # NOT here, and each is a scope decision rather than an omission:
  #   * the 29 `flexmark-ext-*` modules (386 files) — milestone 2, as DEPENDENT ports of this one;
  #   * `flexmark-util-experimental`, `flexmark-tree-iteration`, the five converter modules
  #     (`docx`, `pdf`, `html2md`, `jira`, `youtrack`), `flexmark-profile-pegdown` and the three
  #     `flexmark-ext-{spec-example,xwiki-macros,zzzzzz}` — 219 files with no coverage in the
  #     reference hand port either, so there is no shape to compare a mechanical port against;
  #   * `flexmark-test-util` / `flexmark-test-specs` / `flexmark-core-test` — published test
  #     INFRASTRUCTURE (ordinary main-scope java that other modules' tests compile against). They
  #     are what a test milestone needs and they are not this module's surface.
  #
  # `excludeGlobs` is deliberately absent: the loader's default already drops `package-info.java`
  # and `module-info.java`, which is exactly the 28 files here that declare no type.
  includeGlobs = [
    "flexmark/src/main/java/**.java",
    "flexmark-util-ast/src/main/java/**.java",
    "flexmark-util-builder/src/main/java/**.java",
    "flexmark-util-collection/src/main/java/**.java",
    "flexmark-util-data/src/main/java/**.java",
    "flexmark-util-dependency/src/main/java/**.java",
    "flexmark-util-format/src/main/java/**.java",
    "flexmark-util-html/src/main/java/**.java",
    "flexmark-util-misc/src/main/java/**.java",
    "flexmark-util-options/src/main/java/**.java",
    "flexmark-util-sequence/src/main/java/**.java",
    "flexmark-util-visitor/src/main/java/**.java",
  ]

  # DECISION D-md-3 — THE FRONTEND CLASSPATH IS ONE JAR, AND IT IS NOT A RUNTIME CONCERN.
  #
  # `org.jetbrains:annotations:24.0.1` — every `flexmark-util-*` pom declares it at compile scope
  # and 594 of the covered files import `@NotNull`/`@Nullable` from it. It is here so SPOON can
  # RESOLVE those annotations; an annotation the frontend cannot resolve does not fail, it resolves
  # WRONGLY, and the port then emits nonsense and reports success (CLAUDE.md §5.1). Nothing in the
  # emitted Scala names it: the annotations are markers, this milestone declares no
  # `preservedAnnotations`, and the engine's own nullability handling is what will eventually read
  # them.
  #
  # It is the ONLY external compile dependency reaching this scope. `org.nibor.autolink` is
  # `flexmark-ext-autolink`'s and arrives with milestone 2; `com.ibm.icu`, `commons-io` and
  # `org.jsoup` touch only the converter modules, which are out of scope entirely.
  #
  # The file is written by `FlexmarkClasspath` (see `FlexmarkMigrate`), so the frontend has ONE
  # input to read, and a declared file that is not there is fatal (`PortConfig`).
  # exactly what the poms of the modules in scope declare at compile scope; the engine resolves them
  classpathCoordinates = ["org.jetbrains:annotations:24.0.1", "org.nibor.autolink:autolink:0.6.0"]
  classpathFile = "@work/flexmark-classpath.txt"
}

output {
  portRoot  = "@ports/ssg-md"
  sourceSet = "main"
}

# flexmark's policy. A BASE manifest — it has no bases of its own, and it is the one milestone 2's
# 29 extension ports will each declare as `base = "…"` rather than restate (CLAUDE.md §1.5).
manifest {
  name    = "ssg-md"
  governs = ["com.vladsch.flexmark"]

  # DECISION D-md-4 — THE REFERENCE HAND PORT'S NAMESPACE, AND ITS ONE DEVIATION.
  #
  # `../ssg/ssg-md` declares `package ssg.md.*`, and the map from upstream to it is a single
  # uniform prefix replace with EXACTLY ONE exception: `util.builder -> util.build`. Derived from
  # the hand port's own 761 `Ported from:` headers (86 distinct upstream-package pairs); verified
  # collision-free over the WHOLE 53-module tree, so a later milestone widening scope inherits a
  # map that still has nothing to reconcile.
  #
  # BOTH keys are written, and the second is not redundant: `PackageRenameTransform` is
  # LONGEST-PREFIX-WINS, cut only at a `Symbol.fullName` separator (CLAUDE.md §4.56), so
  # `com.vladsch.flexmark.util.builder.X` takes the longer key and everything else takes the
  # shorter one. There is no ordering to get wrong and no `subPackages`/`typeRenames` entry to
  # write: those two keys move a TYPE within the namespace, and this is a PACKAGE moving to a
  # different package — which is what `packageRenames` is.
  #
  # `packageRenames` is DATA rather than a surface entry (CLAUDE.md §4.56): the rename must run
  # after every other phase, because all of their policy is written in the UPSTREAM namespace, and
  # `runsAfter` cannot state "after everything". `PortRun` appends it last and verifies it with
  # `PackageRenameTransform.check`.
  packageRenames {
    "com.vladsch.flexmark"              = "ssg.md"
    "com.vladsch.flexmark.util.builder" = "ssg.md.util.build"
  }

  # DECISION D-md-5 — THE STARTING POLICY IS THE ONE simple-graphs, jbump AND liqp START FROM.
  #
  # Two phases, no parameters. Milestone 1 measures a WALL, and a wall measured under invented
  # policy says nothing about the engine — nor is it comparable with any other library's first
  # number, which is the whole point of a corpus. Every adjustment after this one arrives with the
  # measurement that justified it.
  #
  # THREE THINGS THE REFERENCE HAND PORT MAKES TEMPTING AND THAT ARE DELIBERATELY NOT HERE, because
  # CLAUDE.md §3.5 is explicit that what a hand port EMITTED is evidence and what it implies for a
  # MECHANICAL port is a hypothesis that gets measured first:
  #
  #   * a `NullabilityTransform` at `Target.Wrapper("ssg.md.Nullable")`. 300 of the hand port's
  #     files use it and 594 upstream files carry the annotations that drive it, so this is the
  #     single highest-leverage manifest entry this port will ever have — and it moves EVERY
  #     emitted signature at once, which is a wave of its own with a number of its own;
  #   * a `scope { }` on `collections`. 48 of the hand port's files keep `java.util` and 45 use
  #     scala collections, which is the same shape ssg-liquid had, and reading it as a scope cost
  #     that port `27 -> 47` errors and then `27 -> 51` turned off;
  #   * a `bean-properties` entry. `Node.getParent()`/`setParent()` becomes `def parent` /
  #     `def parent_=` in the hand port, consistently — and `BeanCollapse`'s emitted shape is
  #     DERIVED from the program rather than tabulated (CLAUDE.md §1.5), so it is the one phase
  #     whose base/dependent disagreement no fingerprint can see. It goes in when the extensions
  #     that would re-derive it exist to be measured against.
  surface = [
    { transform = "collections" },
    { transform = "mutable-params" },
  ]

  # DECISION D-md-11 — THE LIBRARY'S OWN CLASSPATH RESOURCE, SHIPPED.
  #
  # `Html5Entities` reads `/com/vladsch/flexmark/util/sequence/entities.properties` in a STATIC
  # INITIALISER to build the HTML5 entity table, so every `&nbsp;` in every document needs it. The
  # lookup is a string literal and a rename decides ownership structurally, never from a string
  # (CLAUDE.md §4.56) — so the emitted `ssg.md.util.sequence.Html5Entities` asks for the UPSTREAM
  # path, correctly, and until this key existed the run shipped nothing there. Absent, the port
  # throws `ExceptionInInitializerError` and then `NoClassDefFoundError` at the second use, which is
  # what three of the four conformance suites did on their first run — at no
  # compile error, no check count and no member digest.
  #
  # This is the FIRST of the two occurrences that made the mechanism CLAUDE.md §1(b) policy, and it
  # was being carried by a LANE FLAG: `md-test-measure` put the upstream directory on
  # the test JVM's classpath with `--resource-dir`, which makes the SUITE pass and leaves the PORT
  # shipping nothing. The flag now points at what this run writes, so the lane measures the
  # deliverable instead of standing in for it.
  #
  # ONE file, and the root holds exactly that one — so there is no declaration-versus-scan question
  # here at all, which is the other half of why this library is the right second witness: the
  # mechanism's list is a decision only where a library HAS build files beside its resources.
  # The spec files under `flexmark-test-specs` are deliberately NOT here: they are the harness's
  # INPUT, in a module this port does not convert, and they stay `--resource-dir` flags on the test
  # lane. What a port SHIPS is what its own emitted code reads.
  resources = [
    { root  = "@consumer/original-src/flexmark-java/flexmark-util-sequence/src/main/resources"
      files = ["com/vladsch/flexmark/util/sequence/entities.properties"] }
  ]

  # `targets` is NOT declared, so this module claims all three platforms — sge and ssg target every
  # platform wherever possible (CLAUDE.md §1.5), and the reference `ssg-md` really is built for
  # jvm, js and native. It is stated here as a comment rather than as a key because the default IS
  # the claim, and writing it out would suggest a narrowing decision somebody made.

  # The reference hand port for ssg-md. The hand-written flexmark port lives in ssg's own tree.
  # Not inherited: comparing against a hand port is per-library policy, and empty policy is a
  # no-op.
  parity { roots = ["@consumer/ssg-md/src/main/scala"] }
}

# DECISION D-md-6 — BSD-2-CLAUSE, AND THE NOTICE LIVES IN ONE FILE (CLAUDE.md §4.57).
#
# flexmark-java carries **zero** per-file licence headers — every sampled source begins directly at
# `package com.vladsch.…` — so the emitted banner naming the licence is a POINTER and nothing else,
# and BSD-2's first condition is that the copyright notice and the conditions be RETAINED in source
# redistributions. This is exactly the shape liqp's MIT case exposed: naming a licence is not
# including its notice, no check in the pipeline can tell the two apart, and the port compiles and
# reads flat either way.
#
# `LICENSE.txt` is the whole of it, and it carries TWO copyright holders (Atlassian Pty Ltd
# 2015-2016; Vladimir Schneider 2016-2018) — which is the other reason it cannot be derived. There
# is no `NOTICE` file in this upstream. Relative to THIS FILE, like every other path here; a
# declared file that is not there is fatal.
provenance {
  upstreamName     = "flexmark-java"
  originalLicense  = "BSD-2-Clause"
  # The emitted header reads `<prefix>/<origin relativised against sourceRoot>`, and D-md-1's root
  # IS the upstream checkout — so a relativised origin already reads
  # `flexmark-util-ast/src/main/java/com/vladsch/…` and the prefix restores the checkout directory
  # the way `sge-vfx`'s does. Also the marker the emitter cuts at when no root is configured, which
  # is why it is a real path segment rather than decoration.
  sourcePathPrefix = "flexmark-java"
  # `upstreamCommit` is omitted on purpose: derived from the vendored tree's own git state, which
  # is the only value that cannot go stale. The hand port pins
  # bcfe84a3ab6d23d04adce3e5a0bae45c6b791d14 in every file header; this run states what it read.
  notices = [
    "@consumer/original-src/flexmark-java/LICENSE.txt",
  ]
}

# A single source set compiled standalone by `scala-cli`: the support types the collections phase
# retypes onto ship beside the emitted code. Same reason as liqp and simple-graphs — there is no
# second module of this port yet to carry them, and milestone 2's dependents will take
# `RuntimeMode.Dependency` against this one.
runtimeMode = "vendored"

nextStep = "just md-measure"
