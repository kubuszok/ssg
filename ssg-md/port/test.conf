# -------------------------------------------------------------------------------------------
# ssg-md's BEHAVIOURAL GATE — THREE upstream trees, one emitted test source set.
#
# Milestone 1 emitted 468 Scala files and measured a compile-error census — the absence of a suite
# was by far the largest thing wrong with this port. CLAUDE.md §3 is why: a compile-error count is
# typer-only, and every one of CLAUDE.md §4.4's Java forms translates to VALID Scala meaning
# something else. This library is a character-level
# markdown parser — the densest `switch`/`break`/post-increment/`char`-arithmetic population any
# corpus library has — so that unmeasured population is larger here than anywhere else, not smaller.
#
# ==THE THREE TREES, AND WHY THEY ARE ONE SOURCE SET==
#
#   1. `flexmark-util/src/test/java` — 52 files, **730 plain `@Test`**, the UNIT suite. The twelve
#      scoped modules ship no `src/test` at all: the split `flexmark-util-*` libraries are tested
#      from the `flexmark-util` AGGREGATOR, whose own `src/main/java` is empty and whose pom
#      `dependsOn`s all eleven. So the suite for the code milestone 1 emits lives in a module that
#      this port does not convert — which is why `md-measure`'s discovery block asserts a zero and
#      says the zero is a fact about the SCOPE (`java_test_count` over the twelve is 0, and stays 0).
#   2. `flexmark-test-util/src/main/java` — 33 files, the test INFRASTRUCTURE. Ordinary main-scope
#      java that other modules' tests compile against, and D-mdt-4 is why it is here rather than in
#      `main.conf`.
#   3. four files of `flexmark-core-test/src/test/java` — the CONFORMANCE suites (D-mdt-5).
#
# They are ONE source set because they are one compile and one run: `sourceSet` is `main | test` and
# nothing else, so a second port could not write a third directory, and two ports writing `test`
# would each delete the other's output. That is not a compromise — a test-infrastructure class and
# the suite that extends it belong to the same `src_managed/test/scala` in any build that could
# consume this port.
#
# A DEPENDENT of `main.conf`: it resolves against the twelve modules' JAVA, never against the Scala
# that port emitted, so it INHERITS `packageRenames` (`com.vladsch.flexmark` -> `ssg.md`, with
# `util.builder` -> `util.build`) and both surface phases through `base` rather than restating them
# (CLAUDE.md §1.5). Everything under `input`, `output`, `provenance` and `runtimeMode` is a fact
# about THIS source set's build and is deliberately its own.
# -------------------------------------------------------------------------------------------

# see `main.conf`: the same three roots
roots {
  consumer = "../.."
  work     = "../../target/balticporter-work"
  ports    = "../../target/balticporter"
}

label = "ssg-md-test"
base  = "main.conf"

input {
  # DECISION D-mdt-1 — THE SOURCE ROOT IS THE CHECKOUT, EXACTLY AS THE MAIN PORT'S IS.
  #
  # This root was the ONE test tree for as long as this source set was one tree. It is three now
  # (see the header), and they live in three different maven modules with no common ancestor short
  # of the checkout — so the root is the checkout and `includeGlobs` states the scope, which is
  # `main.conf` D-md-1's shape for `main.conf` D-md-1's reason: flexmark is 53 maven modules all
  # declaring under one package root, and no single directory is both a package root and a scope
  # boundary.
  #
  # `PortRun.converted` still works, and this is the half worth reading. Its test is "under
  # `sourceRoot`, not under a `resolutionRoot`" (CLAUDE.md §5.4) — the second conjunct is what
  # carries the whole answer here: every one of the twelve modules below IS a resolution root, so
  # the 486 java files this run resolves against are excluded by it, exactly as they were excluded
  # by the narrow root before. What remains under the root and under no resolution root is the
  # three trees, which is this run's own scope.
  sourceRoot = "@consumer/original-src/flexmark-java"

  # DECISION D-mdt-4 — THE TEST INFRASTRUCTURE IS THIS SOURCE SET'S, NOT THE MAIN PORT'S.
  #
  # `flexmark-test-util` is `src/main/java` upstream and could be read as milestone 1 scope. It is
  # not, and the reason is the emitted SURFACE rather than the upstream directory:
  #
  #   * it compiles against JUNIT (`org.junit.Test`, `org.junit.Rule`, `org.junit.rules`,
  #     `org.junit.ComparisonFailure`, `org.junit.AssumptionViolatedException`) and against
  #     hamcrest. `main.conf` claims all three platforms (D-md-5's closing note) and junit is
  #     JVM-only, so putting these thirty-three files there would either narrow the LIBRARY's
  #     `targets` or make `portability`/`dependency-coverage` report a JVM-only dependency against
  #     a module that claims Native — a fact about the test harness reported as a fact about the
  #     markdown parser;
  #   * `TestFrameworkTransform` is this source set's phase (D-mdt-3) and these files are what it
  #     has to convert: `FullSpecTestCase` DECLARES the `@Test` the four conformance suites inherit.
  #     A `@Test` in the main port is a `@Test` no phase in that pipeline would look at;
  #   * nothing in the twelve modules references it. It is a leaf that only tests reach, which is
  #     what "test infrastructure" means when the word is not a directory name.
  #
  # ==WHAT IS NOT HERE== `flexmark-test-util/src/test/java` (3 files — this module's own tests) and
  # `flexmark-test-specs/src/main/java` (`TestSpecLocator`, one class holding one `ResourceLocation`
  # constant that nothing in scope reads). Both are scope decisions and neither is an omission: the
  # first is a suite for the harness rather than for the library, and the second is reachable only
  # from the `ComboSpecTestCase` subclasses this milestone does not carry.
  #
  # DECISION D-mdt-5 — FOUR CONFORMANCE SUITES, ENUMERATED, PLUS THE BASE THEY SHARE.
  #
  # `flexmark-core-test/src/test/java` holds 40 files, of which 36 are `@RunWith(Parameterized)`
  # `ComboSpecTestCase` subclasses and `@RunWith(Suite.class)` aggregators — the documented refusal,
  # needing a hand-written driver rather than an engine change. The four
  # named below are not: `FullOrigSpec*CoreTest` drive the bundled CommonMark spec files through the
  # ONE plain `@Test` that `FullSpecTestCase` declares, and `OrigSpecCoreTest` is the abstract base
  # all four extend. Enumerated rather than globbed for D-md-2's reason — a glob would silently
  # admit the 36, and a scope nobody can read off the file drifts.
  #
  # THIS IS WHAT THE SOURCE SET IS FOR. 2,519 spec examples across four spec versions, rendered by
  # the ported parser and compared against the upstream spec text: CommonMark conformance evidence
  # that neither this port nor the reference hand port has ever had.
  includeGlobs = [
    "flexmark-util/src/test/java/**.java",
    "flexmark-test-util/src/main/java/**.java",
    "flexmark-core-test/src/test/java/com/vladsch/flexmark/core/test/util/renderer/OrigSpecCoreTest.java",
    "flexmark-core-test/src/test/java/com/vladsch/flexmark/core/test/util/renderer/FullOrigSpecCoreTest.java",
    "flexmark-core-test/src/test/java/com/vladsch/flexmark/core/test/util/renderer/FullOrigSpec027CoreTest.java",
    "flexmark-core-test/src/test/java/com/vladsch/flexmark/core/test/util/renderer/FullOrigSpec028CoreTest.java",
    "flexmark-core-test/src/test/java/com/vladsch/flexmark/core/test/util/renderer/FullOrigSpec029CoreTest.java",
  ]

  # DECISION D-mdt-2 — THE RESOLUTION ROOTS ARE THE TWELVE, ENUMERATED, AND NOT THE CHECKOUT.
  #
  # Same list as `main.conf`'s `includeGlobs` and for the same reason (D-md-2): a glob would admit
  # `flexmark-util-experimental`, and a scope nobody can read off the file drifts.
  #
  # THEY ARE ALSO WHAT MAKES OWNERSHIP DECIDABLE NOW THAT THE SOURCE ROOT IS THE CHECKOUT (D-mdt-1).
  # `PortRun.converted` excludes a unit under any of them, so this enumeration is precisely the
  # boundary between what this run RESOLVES and what it CONVERTS — and it cannot overlap the three
  # `includeGlobs` trees above, none of which is a `src/main/java` of one of the twelve.
  #
  # The three trees import NOTHING outside them — verified over every `import` in all ninety files:
  # eleven `com.vladsch.flexmark.util.*` packages plus `com.vladsch.flexmark.{parser,html}` from
  # core, `org.junit`, `org.hamcrest`, `org.jetbrains.annotations`, `java.*` and two `java.awt`
  # classes. `flexmark-test-util`'s own pom declares exactly five of the twelve, junit and the
  # annotations jar, and nothing else.
  resolutionRoots = [
    "@consumer/original-src/flexmark-java/flexmark/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-ast/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-builder/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-collection/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-data/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-dependency/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-format/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-html/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-misc/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-options/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-sequence/src/main/java",
    "@consumer/original-src/flexmark-java/flexmark-util-visitor/src/main/java",
  ]

  # JUnit must be on the FRONTEND's classpath. An `import static org.junit.Assert.assertEquals` the
  # frontend cannot resolve does not FAIL — it resolves WRONGLY, to an unqualified call on the
  # enclosing test class, and the port then emits nonsense and reports success (CLAUDE.md §5.1).
  # Recorded four times already (libGDX's `org.junit.Assert.*`, Ashley's `org.mockito.Mockito.*`,
  # simple-graphs, liqp); this port would have made it five.
  #
  # The file is the MAIN classpath (`org.jetbrains:annotations:24.0.1`, D-md-3) plus the ONE
  # test-scope coordinate `flexmark-util/pom.xml` declares — `junit:junit`, at the **4.13.2** the
  # parent pom's `dependencyManagement` pins. `org.hamcrest:hamcrest-core:1.3` arrives with it
  # TRANSITIVELY and is deliberately not named, although two files import it: a port resolves what
  # the library DECLARES. Written by `FlexmarkTestClasspath.ensure`, which derives it from the main
  # one on every run so the two halves cannot drift.
  # the main coordinates, plus the one test-scope coordinate the poms declare
  classpathCoordinates = ["org.jetbrains:annotations:24.0.1", "org.nibor.autolink:autolink:0.6.0", "junit:junit:4.13.2"]
  classpathFile = "@work/flexmark-test-classpath.txt"

  # `excludeGlobs` REPLACES the default exclusions rather than adding to them, so the two
  # `package-info.java` files `flexmark-test-util` ships have to be restated — the unit suite's own
  # tree holds none, which is why this key was empty while that tree was the whole scope. A
  # declaration-only file has no type to emit and the loader's default is exactly these two globs.
  #
  # THE NINE `@RunWith(Suite.class)` AGGREGATORS STAY (D-mdt-3): they declare no `@Test`, so
  # excluding them would lose no test and prove nothing, while converting them measures what the
  # engine does with a construct it has never met.
  excludeGlobs = ["**/package-info.java", "package-info.java", "**/module-info.java", "module-info.java"]
}

output {
  portRoot  = "@ports/ssg-md"
  sourceSet = "test"
}

manifest {
  name = "ssg-md-test"

  # What the emitted suites READ from the classpath, shipped with them: the CommonMark spec texts
  # the four conformance suites load from the classpath root, and the two module-root marker files
  # the test infrastructure locates its resources by. Both live in modules this source set does not
  # convert, so without the declaration every consumer has to know to add them by hand.
  resources = [
    { root  = "@consumer/original-src/flexmark-java/flexmark-test-specs/src/main/resources"
      files = ["spec.txt", "spec.0.26.txt", "spec.0.27.txt", "spec.0.28.txt", "spec.0.29.txt", "spec.0.30.txt", "com.vladsch.flexmark.test.specs.txt"] },
    { root  = "@consumer/original-src/flexmark-java/flexmark-test-util/src/main/resources"
      files = ["com.vladsch.flexmark.test.util.txt"] }
  ]

  # DECISION D-mdt-3 — ONE PHASE, AND THE THREE THINGS IT DOES NOT CONVERT.
  #
  # The base contributes `packageRenames`, `governs` and its two surface phases; this adds the one
  # phase that is a fact about THIS source set. `TestFrameworkTransform` is JUnit-4-shaped and the
  # UNIT SUITE is squarely inside it: 730 plain `@Test`, no `@RunWith(Parameterized.class)` in that
  # tree, no `@Ignore`, no test-class inheritance.
  #
  # THE OTHER TWO TREES BROUGHT BOTH OF THE CONSTRUCTS THAT LIST SAID WERE ABSENT, and the phase
  # grew for them rather than the scope shrinking. `flexmark-test-util` writes an ordinary java test
  # HIERARCHY — `RenderingTestCase` / `FullSpecTestCase` (which declares the one `@Test` the four
  # conformance suites inherit) / `ComboSpecTestCase` (which OVERRIDES it) — and carries the one
  # `@RunWith(Parameterized.class)` in scope, on `ComboSpecTestCase`, which is refused and counted
  # exactly as the aggregators are. The hierarchy has two answers: the suite parent
  # anchors at the ROOT of the class chain, and an overridden `@Test` stays a `def` with ONE
  # registration at the top declarer. That is why the discovery figure is 726 java `@Test` against
  # 725 registrations and `expected-lost` is 1 — the pair emits one registration and java's own
  # runner also runs one test per concrete class, so nothing is lost.
  #
  # TWO RESIDUES, both of which the phase REPORTS ITSELF (`TestFrameworkTransform.Finding`, one row
  # per construct with its CLAUDE.md §1 classification and its advice), so neither is a thing this
  # file has to keep a list of — they are named here only so the first run's output is read rather
  # than discovered, and both are counted rather than excluded. CLAUDE.md §3: a skip is a decision
  # and a decision is a number.
  #
  #   1. `@Rule public ExpectedException thrown = ExpectedException.none()` in SIX files
  #      (`BitFieldSetTest`, `UtilsTest`, `OrderedSetTest`, `OrderedMapTest`, `OrderedMultiMapTest`,
  #      `LineAppendableImplTest`). A `@Rule` wraps every test in an arbitrary `Statement` and there
  #      is no shape to derive that from, so the phase says so and emits the field as an ordinary
  #      value — its own advice ends "NEVER APPLIED". That is LOUD rather than silent, which is what
  #      makes it admissible at this milestone: JUnit's wrapper is what would have CAUGHT the
  #      expected throw, so without it the exception propagates and MUnit records the test as
  #      FAILED. Such a test appears in `tests.tsv` with the library's own exception on it — never
  #      as a pass (CLAUDE.md §5.1).
  #   2. NINE `@RunWith(Suite.class)` aggregators (`UtilTestSuite` and eight per-package ones). A
  #      custom runner changes how tests are ENUMERATED, which is exactly why the phase refuses it;
  #      here the enumeration it changes is an ORDERING, because every class these name declares its
  #      own `@Test`s and is discovered on its own. They declare no `@Test` themselves, so they
  #      contribute 0 to the discovery count on BOTH sides and can neither inflate nor deflate it.
  #
  # NOT a residue, and worth writing down because it looks like one: the single
  # `import static junit.framework.TestCase.assertEquals`. JUnit 3's `TestCase` extends
  # `junit.framework.Assert`, so the member is the same one, and the phase's `AssertClasses` already
  # names both — it maps onto `munit.Assertions` like every `org.junit.Assert` call beside it.
  #
  # NOT here, deliberately, and both for `main.conf` D-md-5's reason — a hypothesis about the
  # reference hand port gets a NUMBER before it becomes a manifest entry (CLAUDE.md §3.5):
  # `public-field-accessors` (liqp's suite needs it because liqp's contract is "hand me a POJO";
  # nothing in flexmark's util surface is read reflectively, and unscoped that phase's candidate
  # list is every public field in the library, which is noise), and any `dropMethods`.
  surface = [
    { transform = "test-framework" },

    # `SpecExample.classMap` is the test infrastructure's one `ConcurrentHashMap`, built when the class
    # is first touched — so on Scala.js, where the phase's `TrieMap` image does not link, every spec
    # suite failed to link. It keeps java's own type, for `main.conf`'s reason; a dependent's
    # exceptions are added to the base's.
    { transform = "collections"
      scope { except = ["com.vladsch.flexmark.test.util.spec.SpecExample#classMap"] } },

    # WHAT IS LEFT OF JUNIT'S `ExpectedException` RULE AFTER THE PHASE ABOVE, off the JVM.
    #
    # The phase turns every expectation a test arms in its own body into a check around that body,
    # and leaves the `@Rule` field itself as an ordinary value (plus the one arming
    # `RenderingTestCase.assertRendering` makes outside any test body). `org.junit.rules` exists in
    # neither Scala.js's nor Scala Native's JUnit runtime, and `org.junit.Rule` not on Scala Native, so
    # seven classes did not compile there. Both types are re-pointed at a stand-in this source set
    # ships (`test-inject/ssg/md/test/rules`). It is as inert as the JUnit object was under MUnit —
    # no runner applies either — so no test changes what it checks, on any platform.
    #
    # AFTER `test-framework` in this list, because that phase recognises the rule by JUnit's name.
    { transform = "type-redirect"
      redirects {
        "org.junit.rules.ExpectedException" = "ssg.md.test.rules.ExpectedException"
        "org.junit.Rule"                    = "ssg.md.test.rules.Rule"
      } },

    # HOW THE TEST INFRASTRUCTURE FINDS A SPEC FILE, per platform. Java asks `Class.getResource` for a
    # `java.net.URL` and reads `Class.getResourceAsStream`; neither exists on Scala.js, and Scala
    # Native has no `URL`. The three bodies below hand the question to
    # `ssg.md.test.util.TestResources`, one file per row in `ssg-md/src/test/scala{jvm,js,native}`:
    # java's own calls on the JVM, an embedded-resource read on Scala Native, and a read of the test
    # resource directories on Scala.js, which has no classpath at all. The lookup `main.conf`
    # substitutes for the library's own resources cannot be re-keyed here — a dependent may add a
    # substitution key, never change the base's — so the two stream readers are replaced whole.
    { transform = "method-body"
      bodies {
        "com.vladsch.flexmark.test.util.TestUtils#getSpecResourceFileUrl(Class,String)" = """{
  if (resourcePath.isEmpty()) {
    throw new java.lang.IllegalStateException("Empty resource paths not supported")
  } else {
    val resolvedResourcePath: java.lang.String = TestUtils.getResolvedSpecResourcePath(resourceClass.getName(), resourcePath)
    return ssg.md.test.util.TestResources.fileUrl(resourceClass, resolvedResourcePath)
  }
}"""
        # java resolves a relative spec path against the test class's package through `java.io.File`,
        # which Scala.js does not have; a classpath name always uses `/`, so the same resolution is
        # written over the string, as the hand-written port wrote it.
        "com.vladsch.flexmark.test.util.TestUtils#getResolvedSpecResourcePath(String,String)" = """{
  if (resourcePath.startsWith("/")) {
    return resourcePath
  } else {
    val classPath: java.lang.String = "/" + testClassName.replace('.', '/')
    val parentDir: java.lang.String = classPath.substring(0, classPath.lastIndexOf('/'))
    return (parentDir + "/") + resourcePath
  }
}"""
        "com.vladsch.flexmark.test.util.spec.ResourceLocation#getResourceInputStream(ResourceLocation)" = """{
  val stream: java.io.InputStream = ssg.md.test.util.TestResources.open(location.getResourceClass(), location.getResolvedResourcePath())
  if (stream == null) {
    throw new java.lang.IllegalStateException("Could not load " + location)
  } else ()
  return stream
}"""
        "com.vladsch.flexmark.test.util.spec.TemplateReader#getSpecInputStream(String)" = """{
  val specPath: java.lang.String = if (resource != null) resource else "/template.txt"
  val stream: java.io.InputStream = ssg.md.test.util.TestResources.open(classOf[TemplateReader], specPath)
  if (stream == null) {
    throw new java.lang.IllegalStateException(("Could not load " + resource) + " classpath resource")
  } else ()
  return stream
}"""
      } },

    # `BitFieldSetTest`'S SIX ENUMS STATE THEIR CONSTANTS, as the six in the library do (`main.conf`).
    # In the SUITE rather than in each enum because several tests reach an enum through its class
    # literal first (`BitFieldSet.noneOf(BitFields.class)`), when no constant has been created yet.
    # `Enums.announce` does nothing on the JVM, where `BitFieldSet` reads them reflectively as java does;
    # each hands over a function, so `BitFields2` still fails where java fails it — inside `noneOf`.
    { transform = "add-members"
      members = [
        { owner = "com.vladsch.flexmark.util.misc.BitFieldSetTest"
          specs = [
            { name = "announcedBitFields", arity = 0,
              source = "private val announcedBitFields: scala.Unit = ssg.md.util.misc.Enums.announce(classOf[ssg.md.util.misc.BitFieldSetTest.BitFields], () => ssg.md.util.misc.BitFieldSetTest.BitFields.values)",
              why = "no enum reflection off the JVM: BitFieldSet reads this enum's constants from what was announced" },
            { name = "announcedBitFields2", arity = 0,
              source = "private val announcedBitFields2: scala.Unit = ssg.md.util.misc.Enums.announce(classOf[ssg.md.util.misc.BitFieldSetTest.BitFields2], () => ssg.md.util.misc.BitFieldSetTest.BitFields2.values)",
              why = "no enum reflection off the JVM: BitFieldSet reads this enum's constants from what was announced" },
            { name = "announcedIntSet", arity = 0,
              source = "private val announcedIntSet: scala.Unit = ssg.md.util.misc.Enums.announce(classOf[ssg.md.util.misc.BitFieldSetTest.IntSet], () => ssg.md.util.misc.BitFieldSetTest.IntSet.values)",
              why = "no enum reflection off the JVM: BitFieldSet reads this enum's constants from what was announced" },
            { name = "announcedOverIntSet", arity = 0,
              source = "private val announcedOverIntSet: scala.Unit = ssg.md.util.misc.Enums.announce(classOf[ssg.md.util.misc.BitFieldSetTest.OverIntSet], () => ssg.md.util.misc.BitFieldSetTest.OverIntSet.values)",
              why = "no enum reflection off the JVM: BitFieldSet reads this enum's constants from what was announced" },
            { name = "announcedLongSet", arity = 0,
              source = "private val announcedLongSet: scala.Unit = ssg.md.util.misc.Enums.announce(classOf[ssg.md.util.misc.BitFieldSetTest.LongSet], () => ssg.md.util.misc.BitFieldSetTest.LongSet.values)",
              why = "no enum reflection off the JVM: BitFieldSet reads this enum's constants from what was announced" },
            { name = "announcedOverLongSet", arity = 0,
              source = "private val announcedOverLongSet: scala.Unit = ssg.md.util.misc.Enums.announce(classOf[ssg.md.util.misc.BitFieldSetTest.OverLongSet], () => ssg.md.util.misc.BitFieldSetTest.OverLongSet.values)",
              why = "no enum reflection off the JVM: BitFieldSet reads this enum's constants from what was announced" },
          ] }
      ] },
  ]

  # THE TWO `ExceptionMatcher`S EXTEND HAMCREST'S `BaseMatcher`, which Scala Native does not have. The
  # generated suites only call `matches` on them (the phase above asks the matcher itself), so each
  # is replaced by the same class without the hamcrest parent — java's `matches` and its three
  # factories line for line. One file per upstream class, because flexmark ships the class twice.
  #
  # `HtmlBuilderTest` and `HtmlHelpersTest` test the `util.html.ui` package `main.conf` leaves out —
  # java's desktop colours and fonts — and are left out with it.
  dropTypes = [
    "com.vladsch.flexmark.util.ExceptionMatcher",
    "com.vladsch.flexmark.test.util.ExceptionMatcher",
    "com.vladsch.flexmark.util.html.ui.HtmlBuilderTest",
    "com.vladsch.flexmark.util.html.ui.HtmlHelpersTest",
  ]

  # TWO TESTS THE SCALA.JS COMPILER REFUSES AS EMITTED, moved rather than lost. Java passes
  # `Objects::isNull` to the overloaded `ArrayUtils.indexOf`/`lastIndexOf`; emitted as the method
  # value `java.util.Objects.isNull` that compiles on the JVM and Scala Native and fails on Scala.js
  # ("object creation impossible ... Predicate", 5 errors). No key reaches a method value — a
  # call-site substitution refuses one — so both tests are written out in
  # `test-inject/ssg/md/util/misc/ArrayUtilsIndexOfTest.scala` with the function literal
  # `i => Objects.isNull(i)`, every assertion java's, and run on all three platforms.
  # DELETED the day the engine emits such a method reference as a function literal.
  dropMethods = [
    "com.vladsch.flexmark.util.misc.ArrayUtilsTest#test_indexOf()",
    "com.vladsch.flexmark.util.misc.ArrayUtilsTest#test_lastIndexOf()",
  ]

  # the replacements for the drops above, and the `ExpectedException`/`Rule` stand-ins
  inject = ["test-inject"]
}

# BSD-2-Clause, and the notice lives in ONE file — `main.conf`'s D-md-6, restated here because
# `provenance` is a fact about THIS source set's build and is NOT inherited (CLAUDE.md §1.5).
# flexmark-java carries zero per-file licence headers, so the emitted banner naming the licence is a
# POINTER and nothing else; BSD-2's first condition is that the notice be RETAINED in source
# redistributions, and this source set is a derived work of the same original. Both source sets
# write the upstream's own bytes to one path under `src_managed/`, so there is nothing to drift, and
# stating it here is what makes running THIS port alone (a fresh checkout, a `clean`ed module) ship
# the notice too. A declared file that is not there is fatal.
provenance {
  upstreamName     = "flexmark-java"
  originalLicense  = "BSD-2-Clause"
  # D-md-6's prefix, VERBATIM, because D-mdt-1 made this root the same root: a relativised origin
  # now begins `flexmark-util/src/test/java/com/vladsch/…` and one segment restores the checkout
  # directory, exactly as it does for the main port. The emitted header for each of the 52 unit-suite
  # files is BYTE-IDENTICAL to what the narrow root produced with the long prefix — the two spellings
  # concatenate to one string — which is why widening the scope moved no banner.
  sourcePathPrefix = "flexmark-java"
  notices = [
    "@consumer/original-src/flexmark-java/LICENSE.txt",
  ]
}

# NOT `vendored`, unlike the main port: that source set is compiled beside this one and already
# carries the shims (`main.conf`'s `runtimeMode = "vendored"`). Vendoring again would define every
# support type twice — which the JVM tolerates only while the copies agree, and the Scala.js and
# Native linkers reject outright.
runtimeMode = "dependency"

nextStep = "just md-test-measure"
