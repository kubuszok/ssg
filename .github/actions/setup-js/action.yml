name: Setup Node.js
description: >
  Node.js for Scala.js linking and tests. Compiling to Scala.js IR needs none of this — only jobs
  that link or run JavaScript use this action. The Node version is this action's input default,
  nowhere else.

inputs:
  node-version:
    description: Node.js major version
    default: "22"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
