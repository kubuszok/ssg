name: Generated port
description: >
  The Baltic Porter output (target/balticporter) for this commit, generated ONCE per distinct input
  set and shared between jobs and workflows through the Actions cache — see the action this wraps.
  `generate` needs the Scala toolchain and is the only thing in this repository's CI that
  initialises an upstream submodule; `restore` needs neither.
  The shared action keys on ONE submodule (flexmark-java); every further upstream the generation
  reads is initialised by `command` and its recorded commit goes into the key through `key-extra`
  — add the next one in those two places, nowhere else. The port's own inputs (the configurations
  and injected sources under `ssg-liquid/port` and `ssg-md/port`, and the liqp parser step) are in
  the key too: a change to any of them must regenerate, and no other job can (it has no submodule).
  liqp's parser is ANTLR output the upstream does not track, so `command` generates it with liqp's
  own maven wrapper before the generator runs.
  The `uses:` line below is the ONE place the shared action's version is pinned.

inputs:
  mode:
    description: generate | restore
    default: restore
  key:
    description: cache key to restore (the `key` output of the `generate` mode); required for `restore`
    default: ""

outputs:
  key:
    description: the cache key the generated tree is stored under
    value: ${{ steps.port.outputs.key }}

runs:
  using: composite
  steps:
    - name: Read the further upstream commits this checkout records
      id: upstreams
      if: inputs.mode == 'generate'
      shell: bash
      run: |
        set -euo pipefail
        liqp=$(git ls-tree HEAD original-src/liqp | awk '{print $3}')
        katex=$(git ls-tree HEAD original-src/katex | awk '{print $3}')
        roughjs=$(git ls-tree HEAD original-src/roughjs | awk '{print $3}')
        pathdataparser=$(git ls-tree HEAD original-src/path-data-parser | awk '{print $3}')
        pointsoncurve=$(git ls-tree HEAD original-src/points-on-curve | awk '{print $3}')
        pointsonpath=$(git ls-tree HEAD original-src/points-on-path | awk '{print $3}')
        hachurefill=$(git ls-tree HEAD original-src/hachure-fill | awk '{print $3}')
        liquid=$(git rev-parse "HEAD:ssg-liquid/port")
        md=$(git rev-parse "HEAD:ssg-md/port")
        parser=$(git hash-object project/LiqpParserClasspath.scala)
        katexbuilder=$(git hash-object project/KaTeXBuilder.scala)
        roughbuilder=$(git hash-object project/RoughBuilder.scala)
        # build.sbt decides WHICH generators `generatePort` runs: a tree cached before a generator
        # was added would otherwise be restored, and the compile jobs (no submodule) cannot fill the gap
        build=$(git hash-object build.sbt)
        test -n "$liqp" && test -n "$katex" && test -n "$roughjs" && test -n "$pathdataparser" && test -n "$pointsoncurve" && test -n "$pointsonpath" && test -n "$hachurefill" && test -n "$liquid" && test -n "$md" && test -n "$parser" && test -n "$katexbuilder" && test -n "$roughbuilder"
        echo "extra=liqp-$liqp-katex-$katex-rough-$roughjs-pdp-$pathdataparser-poc-$pointsoncurve-pop-$pointsonpath-hf-$hachurefill-ports-$liquid-$md-$parser-$katexbuilder-$roughbuilder-build-$build" >> "$GITHUB_OUTPUT"

    - uses: kubuszok/balticporter/.github/actions/generated-port@55be328a2265f34c8d41d30634569229539cf562
      id: port
      with:
        mode: ${{ inputs.mode }}
        key: ${{ inputs.key }}
        path: target/balticporter
        submodule: original-src/flexmark-java
        command: >-
          git submodule update --init --depth=1 original-src/liqp original-src/katex original-src/roughjs original-src/path-data-parser original-src/points-on-curve original-src/points-on-path original-src/hachure-fill
          && (cd original-src/liqp && chmod +x mvnw && ./mvnw -q generate-sources -pl .)
          && (cd original-src/katex && npm install --no-save 2>/dev/null || true)
          && sbt generatePort
        key-extra: ${{ steps.upstreams.outputs.extra }}
